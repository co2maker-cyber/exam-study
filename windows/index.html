<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>윈도우 서버 실습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽은 Windows Server 2016 바탕 화면을 흉내 낸 실습 화면, 오른쪽은 과제·채점 패널. 좁은 화면에서는 위아래로 쌓는다. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --sunk:#E2E7ED; --line:#CBD3DC;
  --fg:#131C26; --muted:#56636F; --accent:#1C5FB8; --accent-ink:#FFFFFF;
  --ok:#1D8F53; --warn:#A86F08; --bad:#BE3B34;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,"D2Coding",monospace;
  --win:"Malgun Gothic","맑은 고딕","Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#151D26; --sunk:#10171F; --line:#26313D;
  --fg:#E2E8EE; --muted:#8D9AA7; --accent:#6FA8F2; --accent-ink:#06172C;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#151D26; --sunk:#10171F; --line:#26313D;
  --fg:#E2E8EE; --muted:#8D9AA7; --accent:#6FA8F2; --accent-ink:#06172C;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;flex:none;border-radius:7px;background:#0B2A4E;display:grid;place-items:center}
.top h1{margin:0;font-size:19px;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding-block:16px 32px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{margin:0;font-size:18px;line-height:1.35;text-wrap:balance}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--accent);margin-bottom:4px}
.lead{color:var(--muted);font-size:14px;margin:6px 0 10px}
.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.req li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px;counter-increment:r}
.req li::before{content:counter(r);font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.req li.ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.req li.no::before{content:"✗";background:var(--bad);color:var(--surface)}
.req code,.hint code,.ref code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;word-break:break-all}
.req .cmp{grid-column:2;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;background:var(--sunk);border-radius:6px;padding:6px 8px;margin-top:2px;min-width:0}
.req .cmp .k{color:var(--muted);font-weight:700;white-space:nowrap}
.req .cmp .v{color:var(--bad);min-width:0;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.tl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.score b{font-variant-numeric:tabular-nums}
.score.all{color:var(--ok)}
.hint{margin-top:12px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.hint ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tl{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow:auto;margin:0 -6px}
.tl .cat{font-size:12px;font-weight:700;color:var(--muted);padding:10px 6px 4px;letter-spacing:.04em}
.tl button{display:grid;grid-template-columns:18px 1fr;gap:8px;text-align:left;border:0;background:none;padding:6px;border-radius:6px;font-size:14px}
.tl button:hover{background:var(--sunk)}
.tl button.cur{background:var(--sunk);font-weight:700}
.tl .st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px}
.tl .done .st{background:var(--ok);border-color:var(--ok)}
.ref summary{cursor:pointer;font-weight:700;font-size:14px}
.ref table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
.ref td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
.ref td:first-child{white-space:nowrap}
.stage{min-width:0}
.stage .note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* ───── Windows 화면 (실제 Windows처럼 항상 밝은 대화 상자) ───── */
.desk{position:relative;height:680px;border-radius:8px;overflow:hidden;user-select:none;-webkit-user-select:none;
  font-family:var(--win);font-size:12px;color:#000;line-height:1.35;
  background:#0B2A4E radial-gradient(120% 90% at 70% 10%,#1A5C9C 0%,#0E3866 45%,#081F3A 100%);touch-action:manipulation}
@media (max-width:700px){.desk{height:600px}}
.desk input,.desk select,.desk textarea,.desk button{font-family:var(--win);font-size:12px;color:#000}
.icons{position:absolute;left:6px;top:6px;display:flex;flex-direction:column;gap:4px;z-index:1}
.dicon{width:78px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;text-align:center;border:1px solid transparent;cursor:default;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.dicon:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25)}
.dicon.sel{background:rgba(120,180,255,.3);border-color:rgba(160,200,255,.6)}
.tbar{position:absolute;left:0;right:0;bottom:0;height:38px;background:#121820;display:flex;align-items:stretch;z-index:5000}
.tbar .sb{width:46px;border:0;background:none;display:grid;place-items:center}
.tbar .sb:hover,.tbar .tb-app:hover{background:#2A323C}
.tb-apps{flex:1;display:flex;min-width:0;overflow:hidden}
.tb-app{border:0;background:none;color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;max-width:170px;min-width:0;border-bottom:2px solid #7AB7FF}
.tb-app span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-app.act{background:#2E3946}
.tclock{color:#fff;padding:0 12px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11px;font-variant-numeric:tabular-nums}
.smenu{position:absolute;left:0;bottom:38px;width:300px;max-width:100%;max-height:calc(100% - 38px);overflow:auto;background:#1E2328;color:#fff;z-index:5001;padding:8px 0;box-shadow:0 0 20px rgba(0,0,0,.5)}
.smenu .sh{padding:8px 14px 4px;font-size:11px;color:#9AA4AE}
.smenu .si{display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:default}
.smenu .si:hover{background:#3A434C}

.win{position:absolute;background:#fff;border:1px solid #9AA6B2;box-shadow:0 8px 30px rgba(0,0,0,.45);display:flex;flex-direction:column;min-width:200px}
.win.act{border-color:#1883D7}
.win .tt{height:30px;flex:none;display:flex;align-items:center;gap:6px;padding-left:8px;background:#fff;cursor:default;touch-action:none}
.win .tt .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.win:not(.act) .tt .tn{color:#888}
.win .tt button{width:44px;height:30px;border:0;background:none;font-size:14px;color:#000;flex:none}
.win .tt button:hover{background:#E5E5E5}
.win .tt button.x:hover{background:#E81123;color:#fff}
.win .wb{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}
.win.dlg .wb{background:#F0F0F0;overflow:auto}
.blk{position:absolute;inset:0;z-index:50}
.pad{padding:10px 12px}

.menubar{display:flex;gap:0;padding:1px 2px;border-bottom:1px solid #E3E3E3;flex:none;background:#fff}
.menubar span{padding:3px 8px}
.menubar span:hover{background:#E5F3FF}
.toolbar{display:flex;gap:2px;padding:3px 6px;border-bottom:1px solid #E3E3E3;flex:none;background:#fff;color:#555;flex-wrap:wrap}
.toolbar span{padding:2px 6px;border:1px solid transparent}
.toolbar span.on:hover{border-color:#99D1FF;background:#E5F3FF;color:#000}
.mmc{flex:1;display:flex;min-height:0}
.tree{width:40%;max-width:280px;min-width:120px;border-right:1px solid #DADADA;overflow:auto;padding:2px 0;background:#fff}
.trow{display:flex;align-items:center;gap:3px;height:20px;padding-right:6px;white-space:nowrap;border:1px solid transparent;cursor:default}
.trow:hover{background:#E5F3FF}
.trow.sel{background:#CCE8FF;border-color:#99D1FF}
.trow .ex{width:14px;flex:none;text-align:center;font-size:9px;color:#555}
.pane{flex:1;min-width:0;overflow:auto;background:#fff;display:flex;flex-direction:column}
.status{flex:none;border-top:1px solid #DADADA;padding:2px 6px;color:#555;background:#F0F0F0;min-height:19px}
.lv{border-collapse:collapse;width:100%;min-width:max-content}
.lv th{font-weight:400;text-align:left;padding:3px 8px;border-right:1px solid #E5E5E5;border-bottom:1px solid #E5E5E5;color:#333;white-space:nowrap;position:sticky;top:0;background:#fff}
.lv td{padding:2px 8px;white-space:nowrap;border:1px solid transparent}
.lv tr.r:hover td{background:#E5F3FF}
.lv tr.r.sel td{background:#CCE8FF}
.lv td .ic{vertical-align:-3px;margin-right:4px}
.lvwrap{flex:1;overflow:auto;min-height:60px}
.empty{color:#666;padding:14px;text-align:center}
.box{border:1px solid #828790;background:#fff;overflow:auto}
.dl .lv td{padding:2px 6px}
svg.ic{flex:none;display:inline-block}

.fr{display:flex;align-items:center;gap:8px;margin:5px 0;flex-wrap:wrap}
.fr>label:first-child,.fr>.lb{min-width:var(--lw,120px)}
.wi{height:23px;border:1px solid #7A7A7A;background:#fff;padding:0 4px;outline:none;min-width:0;max-width:100%}
.wi:focus{border-color:#0078D7}
.wi:disabled,.ipc.dis{background:#F0F0F0;border-color:#CCC;color:#6D6D6D}
textarea.wi{height:auto;padding:3px 4px;resize:none}
select.wi{padding:0 2px}
.ipc{display:inline-flex;align-items:center;height:23px;border:1px solid #7A7A7A;background:#fff;padding:0 2px}
.ipc:focus-within{border-color:#0078D7}
.ipc input{width:28px;border:0;outline:none;text-align:center;padding:0;height:19px;background:transparent}
.ipc i{font-style:normal;color:#000}
.ipc.dis i{color:#999}
.ck,.rd{display:inline-flex;align-items:center;gap:5px;margin:3px 0;cursor:default}
.ck input,.rd input{margin:0;width:13px;height:13px}
.dis,.ck.dis,.rd.dis{color:#6D6D6D}
.wbtn{min-width:75px;height:23px;padding:0 10px;background:#E1E1E1;border:1px solid #ADADAD;border-radius:0;white-space:nowrap}
.wbtn:hover:not(:disabled){background:#E5F1FB;border-color:#0078D7}
.wbtn:active:not(:disabled){background:#CCE4F7}
.wbtn.def{border-color:#0078D7;box-shadow:inset 0 0 0 1px #0078D7}
.wbtn:disabled{color:#A0A0A0;background:#CCC;border-color:#BFBFBF}
.wbtn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 12px;flex-wrap:wrap}
.gb{border:1px solid #DCDCDC;padding:8px 10px 6px;margin:10px 0 6px;position:relative}
.gb>.gl{position:absolute;top:-8px;left:7px;background:#F0F0F0;padding:0 3px}
.tabs{display:flex;gap:0;padding:6px 8px 0;flex-wrap:wrap}
.tabs span{padding:3px 9px;border:1px solid #D9D9D9;border-bottom:0;background:#F0F0F0;margin-right:-1px;cursor:default;position:relative;top:1px}
.tabs span.on{background:#fff;border-color:#D9D9D9;z-index:1;padding-bottom:4px;top:1px}
.tabp{border:1px solid #D9D9D9;background:#fff;margin:0 8px;padding:10px 12px;min-height:200px}
.tabp .gb>.gl{background:#fff}
.txt{margin:4px 0;color:#000}
.small{color:#555;font-size:11px}
.wiz{display:flex;flex-direction:column;min-height:100%}
.wiz-h{background:#fff;padding:10px 16px;border-bottom:1px solid #DADADA}
.wiz-h b{display:block;font-size:12px}
.wiz-h div{padding-left:14px;color:#333;margin-top:2px}
.wiz-b{padding:12px 20px;flex:1}
.wiz-w{display:flex;flex:1;background:#fff}
.wiz-w .band{width:120px;flex:none;background:linear-gradient(#0F5AA6,#06305C)}
.wiz-w .wc{padding:16px 20px}
.wiz-w h4{font-size:17px;font-weight:400;margin:0 0 14px}
.wiz-steps{width:150px;flex:none;padding:10px 12px;border-right:1px solid #DADADA;background:#fff}
.wiz-steps div{padding:3px 0 3px 10px;color:#666}
.wiz-steps div.on{color:#000;font-weight:700}
.wiz-steps div::before{content:"● ";color:#2C7BD3;font-size:8px;vertical-align:2px}
.wsep{border-top:1px solid #DADADA;margin:0}
.ctx{position:absolute;z-index:9000;background:#F2F2F2;border:1px solid #CCC;box-shadow:2px 2px 6px rgba(0,0,0,.25);padding:2px 0;min-width:180px;max-width:300px}
.ctx .mi{padding:4px 28px 4px 26px;position:relative;white-space:nowrap;cursor:default}
.ctx .mi:hover{background:#91C9F7}
.ctx .mi.dis{color:#999}
.ctx .mi.dis:hover{background:none}
.ctx .mi.b{font-weight:700}
.ctx .mi .ar{position:absolute;right:8px}
.ctx .sep{border-top:1px solid #D7D7D7;margin:3px 2px 3px 26px}
.msg{display:flex;gap:12px;padding:18px 16px 10px;background:#fff;white-space:pre-wrap;max-width:420px}
.msg+.foot{background:#F0F0F0;border-top:1px solid #DFDFDF}
.cmdw{flex:1;background:#0C0C0C;color:#CCC;font-family:Consolas,var(--mono);font-size:13px;padding:4px 6px;overflow:auto;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text;line-height:1.3}
.cmdw input{background:transparent;border:0;outline:none;color:#CCC;font:inherit;width:60%;padding:0}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px;padding:8px}
.feat div{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;text-align:center;border:1px solid transparent}
.feat div:hover{background:#E5F3FF}
.feat div.sel{background:#CCE8FF;border-color:#99D1FF}
.feat div.na{color:#999}
.iisw{display:flex;flex:1;min-height:0}
.iisw .main{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
.actp{width:190px;flex:none;border-left:1px solid #DADADA;overflow:auto;background:#fff}
.actp .ah{background:#DDE7F3;padding:3px 8px;font-weight:700}
.actp .ag{padding:4px 8px 4px;color:#555;font-weight:700}
.actp a{display:block;padding:2px 8px 2px 18px;color:#0066CC;text-decoration:none;cursor:default}
.actp a:hover{text-decoration:underline}
.actp a.dis{color:#999;text-decoration:none}
.fh{padding:8px 12px;border-bottom:1px solid #E3E3E3}
.fh b{font-size:16px;font-weight:400}
.fh p{margin:4px 0 0;color:#444}
@media (max-width:640px){.iisw{flex-direction:column}.actp{width:auto;border-left:0;border-top:1px solid #DADADA;max-height:150px}.tree{width:42%}}
.addr{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #E3E3E3;flex:none}
.addr .ab{flex:1;border:1px solid #D9D9D9;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fgrid{display:flex;flex-wrap:wrap;gap:4px;padding:8px;align-content:flex-start}
.fgrid .fi{width:86px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-align:center;border:1px solid transparent;word-break:break-all}
.fgrid .fi:hover{background:#E5F3FF}
.fgrid .fi.sel{background:#CCE8FF;border-color:#99D1FF}
.smw{display:flex;flex:1;min-height:0}
.smw .nav{width:170px;flex:none;background:#fff;border-right:1px solid #DADADA}
.smw .nav div{padding:8px 12px;cursor:default}
.smw .nav div.on{background:#E1ECF7;font-weight:700}
.smw .nav div:hover{background:#EEF4FB}
.smh{background:#21364F;color:#fff;display:flex;align-items:center;padding:8px 12px;gap:10px;flex:none}
.smh b{font-size:17px;font-weight:400;flex:1}
.smh span{padding:2px 8px;cursor:default}
.smh span:hover{background:#3A5576}
.lnk{color:#0066CC;cursor:default}
.lnk:hover{text-decoration:underline}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 18px;padding:12px 16px}
.kv div:nth-child(odd){color:#555}
.perm{border-collapse:collapse;width:100%}
.perm th{font-weight:400;text-align:center;width:52px;padding:2px}
.perm th:first-child{text-align:left;width:auto}
.perm td{padding:1px 4px}
.perm td:not(:first-child){text-align:center}
.xnav{display:flex;gap:4px;flex-wrap:wrap;width:100%;font-size:13px;margin-bottom:-4px}
.xnav a{color:var(--muted);text-decoration:none;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.xnav a:hover{color:inherit}.xnav a.on{color:inherit;font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
<nav class="xnav" aria-label="사이트"><a href="../index.html">← 학습 홈</a><a href="../router/">라우터</a><a href="../windows/" class="on">윈도우</a><a href="../linux/">리눅스</a></nav>
  <div class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="5" rx="1" fill="#7AB7FF"/><rect x="2" y="8" width="16" height="5" rx="1" fill="#CFE4FF"/><rect x="2" y="14" width="16" height="4" rx="1" fill="#7AB7FF"/><circle cx="15" cy="4.5" r="1" fill="#0B2A4E"/><circle cx="15" cy="10.5" r="1" fill="#0B2A4E"/></svg></div>
  <div><h1>윈도우 서버 실습장</h1><p>네트워크관리사 2급 실기 · Windows Server 2016 설정 연습</p></div>
  <div class="sp"></div>
  <span class="pill" id="prog">완료 0 / 0</span>
</div></header>
<main class="wrap layout">

function resolveName(q){
  q=nodot(q);if(!q)return null;
  if(isIP(q))return {name:q,ip:q};
  if(q==='localhost')return {name:q,ip:'127.0.0.1'};
  if(q===lc(S.sys.name)||q===nodot(srvFqdn()))return {name:nodot(srvFqdn()),ip:myIPs()[0]||'127.0.0.1'};
  for(let hop=0;hop<5;hop++){
    const z=S.dns.zones.filter(z=>!z.rev&&(q===z.name||q.endsWith('.'+z.name))).sort((a,b)=>b.name.length-a.name.length)[0];
    if(!z)break;const rel=q===z.name?'@':q.slice(0,-(z.name.length+1));
    const a=z.recs.find(r=>r.type==='A'&&lc(r.name)===rel);if(a)return {name:q,ip:a.data,alias:hop?true:false};
    const c=z.recs.find(r=>r.type==='CNAME'&&lc(r.name)===rel);if(c){q=nodot(c.data.includes('.')?c.data:c.data+'.'+z.name);continue;}
    break;
  }
  const known={'www.google.com':'142.250.206.196','google.com':'142.250.206.206','dns.google':'8.8.8.8','www.naver.com':'223.130.200.104'};
  if(known[q])return {name:q,ip:known[q]};
  return null;
}

    W.hist=W.hist||[];

      if(e.key==='Enter'){const v=inp.value;W.out.push('C:\\Users\\Administrator>'+v);if(v.trim()){W.hist.push(v);W.hp=W.hist.length;}runCmd(W,v);W.rerender();setTimeout(()=>{const n=W.body.querySelector('input');n&&n.focus();const sc=W.body.querySelector('.cmdw');sc.scrollTop=sc.scrollHeight;},0);}
      else if(e.key==='ArrowUp'){e.preventDefault();if(W.hist.length){W.hp=Math.max(0,(W.hp??W.hist.length)-1);inp.value=W.hist[W.hp];}}

}
function ipconfigText(all){
  const n=S.nic,L=['','Windows IP 구성',''];
  const v4=n.dhcp?(n.lease||null):n.ips[0];
  if(all){L.push('   호스트 이름 . . . . . . . . : '+S.sys.name,'   주 DNS 접미사 . . . . . . . : '+S.ad.domain,'   노드 유형 . . . . . . . . . : 혼성','   IP 라우팅 사용. . . . . . . : 아니요','   WINS 프록시 사용. . . . . . : 아니요','   DNS 접미사 검색 목록. . . . : '+S.ad.domain,'');}

    else n.ips.forEach(x=>L.push('   IPv4 주소 . . . . . . . . . : '+x.ip+(all?'(기본 설정)':''),'   서브넷 마스크 . . . . . . . : '+x.mask));
    const gw=n.dhcp?(v4.gw||''):(n.gws.map(g=>g.gw).join('\n                                   '));

    if(all){const ds=n.dhcp?(v4.dns||[]):n.dns;L.push('   DNS 서버. . . . . . . . . . : '+(ds.join('\n                                   ')||''));
      L.push('   Tcpip를 통한 NetBIOS. . . . : '+(n.netbios==='off'?'사용 안 함':'사용'));}
  }else if(n.comp.v4&&n.dhcp){L.push('   자동 구성 IPv4 주소 . . . . : 169.254.12.34','   서브넷 마스크 . . . . . . . : 255.255.0.0','   기본 게이트웨이 . . . . . . : ');}
  return L;

function runCmd(W,raw){
  const v=raw.trim().replace(/\s+/g,' ');const L=W.out;if(!v)return;
  const low=v.toLowerCase().replace(/^(ipconfig|netstat|arp|route|ping|nslookup|tracert)\s+-/,(m,a)=>a+' /').replace(/^ipconfig\s*\/\s*/,'ipconfig /');
  S.cmd.log.push(v.toLowerCase());
  const [c,...a]=low.split(' ');const arg=a.join(' ');
  const say=(...x)=>L.push(...x);
  switch(c){
    case 'cls':W.out=[];return;
    case 'exit':closeWin(W);return;
    case 'ver':say('','Microsoft Windows [Version 10.0.14393]','');return;
    case 'hostname':say(S.sys.name);return;
    case 'help':say('명령에 대한 자세한 내용은 HELP 명령어 이름을 입력하십시오.','ARP        ARP 캐시 표시/수정','CLS        화면 지우기','GETMAC     MAC 주소 표시','HOSTNAME   컴퓨터 이름 표시','IPCONFIG   IP 구성 표시 (/all /release /renew /flushdns /displaydns /registerdns)','NET        net user, net share, net start','NETSTAT    프로토콜 통계와 연결 (-a -n -r -s -o)','NSLOOKUP   DNS 조회','PING       연결 확인 (-n 횟수, -t)','ROUTE      라우팅 테이블 (print)','TRACERT    경로 추적','');return;
    case 'ipconfig':{
      if(!arg){say(...ipconfigText(false),'');return;}
      if(arg==='/all'){say(...ipconfigText(true),'');return;}
      if(arg==='/flushdns'){S.cmd.cache=false;say('','Windows IP 구성','','DNS 확인자 캐시를 플러시했습니다.','');return;}
      if(arg==='/displaydns'){say('','Windows IP 구성','');if(S.cmd.cache)say('    localhost','    ----------------------------------------','    데이터 이름 . . . . . : localhost','    데이터 유형 . . . . . : 1','    TTL(Time To Live) . . : 604800','    (호스트) 레코드 . . . : 127.0.0.1','');else say('    캐시에 레코드가 없습니다.','');return;}
      if(arg==='/registerdns'){say('','Windows IP 구성','','이 컴퓨터의 모든 어댑터에 대한 DNS 리소스 레코드 등록을 시작했습니다. 모든 오류는 몇 분 후 이벤트 뷰어에 보고됩니다.','');return;}
      if(arg==='/release'||arg==='/renew'){
        if(!S.nic.dhcp){say('','Windows IP 구성','',`작업 중 어댑터 ${S.nic.name}에서 오류가 발생했습니다.`,'DHCP가 이 어댑터에 사용되지 않습니다.','');return;}
        if(arg==='/release'){S.nic.lease=null;refreshAll();say(...ipconfigText(false),'');return;}

function routeText(say){

function revName(netid){const p=String(netid).trim().replace(/\.+$/,'').split('.').filter(Boolean);if(!p.length||p.length>3||p.some(x=>!/^\d{1,3}$/.test(x)||+x>255))return null;return p.reverse().join('.')+'.in-addr.arpa';}
function revZoneFor(ip){
  const o=ip.split('.');let best=null;
  S.dns.zones.filter(z=>z.rev).forEach(z=>{const p=z.name.replace(/\.in-addr\.arpa$/,'').split('.').reverse();if(p.every((x,i)=>x===o[i])&&(!best||p.length>best.p.length))best={z,p};});
  return best?{zone:best.z,name:o.slice(best.p.length).reverse().join('.')}:null;
}
function findPTR(ip){const r=revZoneFor(ip);if(!r)return null;const p=r.zone.recs.find(x=>x.type==='PTR'&&x.name===r.name);return p?p.data:null;}

function allPrincipals(o={}){const u=S.ad.users.map(x=>x.logon),g=S.ad.groups.map(x=>x.name);return [...new Set([...(o.groupsOnly?[]:u),...g,...(o.groupsOnly||o.noWell?[]:WELL)])];}
function resolvePrincipal(n,o){n=n.trim();if(!n)return null;const all=allPrincipals(o);const strip=n.replace(/^.*\\/,'').replace(/@.*$/,'');

 setup:(st)=>{Object.assign(st.nic,{dhcp:true,ips:[],gws:[],dnsAuto:true,dns:[]});},
 items:p=>[
  {t:`IP 주소: ${C(p.ip)}`,f:()=>ok(!S.nic.dhcp&&S.nic.ips[0]?.ip===p.ip,S.nic.dhcp?'아직 "자동으로 IP 주소 받기"입니다.':`현재 ${S.nic.ips[0]?.ip||'없음'}`)},
  {t:`서브넷 마스크: ${maskTxt(p.N)}`,f:()=>ok(!S.nic.dhcp&&S.nic.ips[0]?.mask===p.N.mask,`현재 ${S.nic.ips[0]?.mask||'없음'}`)},
  {t:`기본 게이트웨이: ${C(p.gw)}`,f:()=>ok(S.nic.gws[0]?.gw===p.gw,`현재 ${S.nic.gws[0]?.gw||'없음'}`)},
  {t:`기본 설정 DNS 서버: ${C(p.dns[0])}`,f:()=>ok(S.nic.dns[0]===p.dns[0],`현재 ${S.nic.dns[0]||'없음'}`)},
  {t:`보조 DNS 서버: ${C(p.dns[1])}`,f:()=>ok(S.nic.dns[1]===p.dns[1],`현재 ${S.nic.dns[1]||'없음'}`)}],
 hint:p=>['시작 단추 오른쪽 클릭 → <b>네트워크 연결</b> (또는 실행 창에 '+C('ncpa.cpl')+')','<b>Ethernet0</b> 오른쪽 클릭 → <b>속성</b>','<b>인터넷 프로토콜 버전 4(TCP/IPv4)</b> 선택 → <b>속성</b>','<b>다음 IP 주소 사용</b>을 고르고 IP, 마스크, 게이트웨이, DNS 입력'+(p.N.showP?` (/${p.N.p} = ${p.N.mask})`:''),'<b>확인</b> → 어댑터 속성 창에서도 <b>확인</b>을 눌러야 적용됩니다.']},

{id:'ipadv',cat:'네트워크 설정',t:'고급 TCP/IP · IPv6 해제',lead:`Ethernet0은 ${C(SRVIP+'/24')}로 설정되어 있습니다. 기존 주소는 그대로 두고 다음을 추가로 설정하십시오.`,
 gen:()=>{const N=genNet({ps:[24,16],bases:['10.10','172.20']});return {ip2:N.host(rnd(5,200)),mask2:N.mask,suf:pick(DOMS),dns2:pick(PUBDNS)[0]};},
 items:p=>[
  {t:`두 번째 IP 주소 ${C(p.ip2)} / ${C(p.mask2)} 추가 (고급 → IP 설정)`,f:()=>ok(S.nic.ips[0]?.ip===SRVIP&&S.nic.ips.some(x=>x.ip===p.ip2&&x.mask===p.mask2),S.nic.ips[0]?.ip!==SRVIP?'기존 주소 '+SRVIP+'가 첫 번째 주소가 아닙니다.':'목록에 없습니다.')},
  {t:`보조 DNS 서버로 ${C(p.dns2)} 추가`,f:()=>ok(S.nic.dns[0]==='127.0.0.1'&&S.nic.dns[1]===p.dns2,`현재 DNS: ${S.nic.dns.join(', ')||'없음'}`)},
  {t:`이 연결의 DNS 접미사: ${C(p.suf)} (고급 → DNS)`,f:()=>ok(lc(S.nic.suffix)===p.suf,`현재 "${S.nic.suffix}"`)},
  {t:'TCP/IP에서 NetBIOS 사용 안 함 (고급 → WINS)',f:()=>ok(S.nic.netbios==='off')},
  {t:'인터넷 프로토콜 버전 6(TCP/IPv6) 사용 해제',f:()=>ok(!S.nic.comp.v6,'어댑터 속성의 IPv6 확인란이 아직 선택되어 있습니다.')}],
 hint:()=>['네트워크 연결 → Ethernet0 속성','IPv6 확인란을 해제합니다.','IPv4 속성 → 보조 DNS 서버 입력 → <b>고급</b>','<b>IP 설정</b> 탭 → IP 주소 [추가], <b>DNS</b> 탭 → 접미사, <b>WINS</b> 탭 → NetBIOS 사용 안 함','고급 창 확인 → IPv4 창 확인 → 어댑터 창 확인']},

{id:'zone',cat:'DNS',t:'정방향 조회 영역 만들기',lead:'DNS 서버에 새 정방향 조회 영역을 만드십시오.',
 gen:()=>{const z=pick(DOMS);const cf=Math.random()<.4;return {z,dyn:pick(['none','nonsecure']),file:cf?z.split('.')[0]+'.dns':z+'.dns',cf};},
 items:p=>[
  {t:`영역 이름 ${C(p.z)}, 주 영역, 정방향`,f:()=>{const z=zoneOf(p.z);return ok(z&&!z.rev&&z.type==='primary',z?'영역 형식이나 방향이 다릅니다.':'영역이 없습니다.');}},
  {t:'Active Directory에 영역을 저장하지 않음 (영역 파일 사용)',f:()=>{const z=zoneOf(p.z);return ok(z&&!z.ad,z?'AD 통합 영역으로 만들어졌습니다.':'영역이 없습니다.');}},
  {t:`영역 파일 이름: ${C(p.file)}${p.cf?'':' (기본값)'}`,f:()=>{const z=zoneOf(p.z);return ok(z&&lc(z.file)===lc(p.file),z?`현재 ${z.file||'(AD 통합)'}`:'영역이 없습니다.');}},
  {t:`동적 업데이트: ${p.dyn==='none'?'동적 업데이트 허용 안 함':'비보안 및 보안 동적 업데이트 허용'}`,f:()=>{const z=zoneOf(p.z);return ok(z&&z.dyn===p.dyn,z?`현재 ${DYN[z.dyn]}`:'영역이 없습니다.');}}],
 hint:()=>['서버 관리자 → 도구 → <b>DNS</b> (또는 '+C('dnsmgmt.msc')+')','<b>정방향 조회 영역</b> 오른쪽 클릭 → <b>새 영역</b>','주 영역 선택, <b>Active Directory에 영역 저장</b> 확인란 해제','영역 이름 → 영역 파일 이름 확인/수정 → 동적 업데이트 선택 → 마침']},

{id:'rec',cat:'DNS',t:'호스트·별칭·메일 교환기 레코드',lead:'',
 gen:()=>{const N=genNet({p:24});const z=pick(DOMS);const ips=shuffle([10,20,30,40,50,80]).slice(0,3).map(i=>N.host(i));return {z,www:ips[0],ftp:ips[1],mail:ips[2],al:pick(['web','home','blog','shop']),pri:pick([5,10,20])};},
 setup:(st,p)=>{st.dns.zones.push(mkZone(p.z,{srv:'server.'+DOMAIN+'.'}));},
 leadF:p=>`영역 ${C(p.z)}이(가) 만들어져 있습니다. 이 영역에 다음 레코드를 등록하십시오.`,
 items:p=>{const Z=()=>zoneOf(p.z);return [
  {t:`호스트(A) ${C('www')} → ${C(p.www)}`,f:()=>{const r=rec(Z(),'A','www');return ok(r&&r.data===p.www,r?`현재 ${r.data}`:'레코드가 없습니다.');}},
  {t:`호스트(A) ${C('ftp')} → ${C(p.ftp)}`,f:()=>{const r=rec(Z(),'A','ftp');return ok(r&&r.data===p.ftp,r?`현재 ${r.data}`:'레코드가 없습니다.');}},
  {t:`호스트(A) ${C('mail')} → ${C(p.mail)}`,f:()=>{const r=rec(Z(),'A','mail');return ok(r&&r.data===p.mail,r?`현재 ${r.data}`:'레코드가 없습니다.');}},
  {t:`별칭(CNAME) ${C(p.al)} → 대상 ${C('www.'+p.z)}`,f:()=>{const r=rec(Z(),'CNAME',p.al);return ok(r&&eqName(r.data,'www.'+p.z),r?`대상이 ${r.data}입니다. 대상은 FQDN으로 입력합니다.`:'레코드가 없습니다.');}},
  {t:`메일 교환기(MX) (같은 부모 폴더) → ${C('mail.'+p.z)}, 우선 순위 ${C(p.pri)}`,f:()=>{const r=Z()&&Z().recs.find(r=>r.type==='MX'&&r.name==='@');return ok(r&&eqName(r.data,'mail.'+p.z)&&r.pri===p.pri,r?`현재 [${r.pri}] ${r.data}`+(eqName(r.data,'mail.'+p.z)?'':' (메일 서버는 FQDN으로 입력)'):'호스트 칸을 비운 MX 레코드가 없습니다.');}}];},
 hint:p=>['DNS 관리자 → 정방향 조회 영역 → '+C(p.z)+' 선택','영역 오른쪽 클릭 → <b>새 호스트(A 또는 AAAA)</b> → 이름과 IP 입력 → <b>호스트 추가</b> (세 번 반복 후 완료)','<b>새 별칭(CNAME)</b> → 별칭 이름, 대상 호스트의 FQDN '+C('www.'+p.z),'<b>새 메일 교환기(MX)</b> → 호스트 칸은 비우고 메일 서버 FQDN과 우선 순위 입력']},

{id:'rev',cat:'DNS',t:'역방향 조회 영역과 PTR 레코드',lead:'',
 gen:()=>{const N=genNet({p:24});const z=pick(DOMS);return {N,z,ip:N.host(rnd(10,200)),h:pick(['www','web','srv1'])};},
 setup:(st,p)=>{st.dns.zones.push(mkZone(p.z,{srv:'server.'+DOMAIN+'.'}));},
 leadF:p=>`정방향 영역 ${C(p.z)}이(가) 있습니다. ${C(p.N.net+'/24')} 네트워크의 역방향 조회 영역을 만들고 호스트를 등록하십시오.`,
 items:p=>{const rn=revName(p.N.net.split('.').slice(0,3).join('.'));return [
  {t:`IPv4 역방향 조회 영역 ${C(rn)} (주 영역, 영역 파일 사용)`,f:()=>{const z=zoneOf(rn);return ok(z&&z.rev&&z.type==='primary'&&!z.ad,z?'형식이 다릅니다 (주 영역, AD 저장 안 함).':'영역이 없습니다. 네트워크 ID에 '+p.N.net.split('.').slice(0,3).join('.')+'을(를) 입력합니다.');}},
  {t:`정방향 영역에 호스트(A) ${C(p.h)} → ${C(p.ip)}`,f:()=>{const r=rec(zoneOf(p.z),'A',p.h);return ok(r&&r.data===p.ip,r?`현재 ${r.data}`:'레코드가 없습니다.');}},
  {t:`${C(p.ip)} → ${C(p.h+'.'+p.z)} 포인터(PTR) 레코드`,f:()=>{const d=findPTR(p.ip);return ok(d&&eqName(d,p.h+'.'+p.z),d?`현재 ${d}`:'PTR 레코드가 없습니다.');}}];},
 hint:p=>['DNS 관리자 → <b>역방향 조회 영역</b> 오른쪽 클릭 → 새 영역','주 영역(AD 저장 해제) → IPv4 역방향 조회 영역 → 네트워크 ID '+C(p.N.net.split('.').slice(0,3).join('.')),'정방향 영역에서 새 호스트를 만들 때 <b>연결된 PTR(포인터) 레코드 만들기</b>를 선택하면 PTR이 함께 만들어집니다.','또는 역방향 영역 오른쪽 클릭 → 새 포인터(PTR)']},

{id:'soa',cat:'DNS',t:'SOA · 영역 전송 · 동적 업데이트',lead:'',
 gen:()=>({z:pick(DOMS),rf:pick([30,60,120]),rt:pick([10,15,20]),ex:pick([7,14,30]),tl:pick([1,2,6]),sec:'192.168.100.'+rnd(11,60)}),
 setup:(st,p)=>{st.dns.zones.push(mkZone(p.z,{srv:'server.'+DOMAIN+'.',recs:[{name:'www',type:'A',data:SRVIP}]}));},
 leadF:p=>`영역 ${C(p.z)}의 속성을 다음과 같이 바꾸십시오.`,
 items:p=>{const Z=()=>zoneOf(p.z);const S_=(k,v,l)=>({t:l,f:()=>ok(Z()&&Z().soa[k]===v,Z()?'현재 '+fmtDur(Z().soa[k]):'영역이 없습니다.')});return [
  S_('refresh',p.rf*60,`새로 고침 간격: ${C(p.rf+'분')}`),S_('retry',p.rt*60,`다시 시도 간격: ${C(p.rt+'분')}`),S_('expire',p.ex*86400,`다음 날짜 이후에 만료: ${C(p.ex+'일')}`),S_('ttl',p.tl*3600,`최소(기본값) TTL: ${C(p.tl+'시간')}`),
  {t:`영역 전송은 보조 DNS 서버 ${C(p.sec)}로만 허용`,f:()=>{const x=Z()&&Z().xfer;return ok(x&&x.allow&&x.mode==='list'&&x.list.length===1&&x.list[0]===p.sec,x?(!x.allow?'영역 전송이 허용되지 않았습니다.':x.mode!=='list'?'"다음 서버로만"을 선택해야 합니다.':'서버 목록: '+(x.list.join(', ')||'없음')):'영역이 없습니다.');}},
  {t:'동적 업데이트: 비보안 및 보안',f:()=>ok(Z()&&Z().dyn==='nonsecure',Z()?'현재 '+DYN[Z().dyn]:'')}];},
 hint:()=>['DNS 관리자 → 영역 오른쪽 클릭 → <b>속성</b>','<b>권한 있는 영역 시작(SOA)</b> 탭: 숫자와 단위(분/시간/일)를 함께 맞춥니다.','<b>영역 전송</b> 탭: 영역 전송 허용 → 다음 서버로만 → [편집]에서 IP 추가','<b>일반</b> 탭: 동적 업데이트 선택 → 확인']},

{id:'fwd',cat:'DNS',t:'전달자와 조건부 전달자',lead:'',
 gen:()=>{const a=pick(PUBDNS);return {f1:a[0],f2:a[1],cd:pick(DOMS),cip:`10.${rnd(1,50)}.${rnd(0,250)}.${rnd(2,250)}`};},
 leadF:p=>'이 DNS 서버가 확인할 수 없는 이름을 외부 DNS 서버로 넘기도록 설정하십시오.',
 items:p=>[
  {t:`전달자 1순위 ${C(p.f1)}, 2순위 ${C(p.f2)}`,f:()=>ok(S.dns.fwd[0]===p.f1&&S.dns.fwd[1]===p.f2,`현재 ${S.dns.fwd.join(', ')||'없음'}`)},
  {t:'사용할 수 있는 전달자가 없을 경우 루트 힌트 사용 안 함',f:()=>ok(!S.dns.useRoot)},
  {t:`조건부 전달자: 도메인 ${C(p.cd)} → 마스터 서버 ${C(p.cip)}`,f:()=>{const c=S.dns.cfw.find(x=>x.domain===p.cd);return ok(c&&c.ips.includes(p.cip),c?'마스터 서버: '+c.ips.join(', '):'조건부 전달자가 없습니다.');}}],
 hint:()=>['DNS 관리자 → 서버(SERVER) 오른쪽 클릭 → <b>속성</b> → <b>전달자</b> 탭 → [편집]','IP를 순서대로 추가하고 루트 힌트 확인란을 해제합니다.','<b>조건부 전달자</b> 폴더 오른쪽 클릭 → 새 조건부 전달자']},

{id:'scope',cat:'DHCP',t:'DHCP 범위 만들기',lead:'DHCP 서버에 새 IPv4 범위를 만드십시오.',
 leadF:p=>p.unauth?'DHCP 서버가 아직 Active Directory에서 권한을 부여받지 않았습니다. 권한을 부여하고 새 IPv4 범위를 만드십시오.':'DHCP 서버에 새 IPv4 범위를 만드십시오.',
 setup:(st,p)=>{if(p.unauth)st.dhcp.auth=false;},
 gen:()=>{const N=genNet({ps:[24,24,25]});N.showP=Math.random()<.4;const a=pick([11,21,31]);const b=N.size-pick([6,11]);const ea=a+rnd(10,30),eb=ea+rnd(4,9);
   return {unauth:Math.random()<.5,N,name:pick(['본사-LAN','영업부','Office','LAN-A','3층']),s:N.host(a),e:N.host(b),xs:N.host(ea),xe:N.host(eb),lease:pick([{d:1,h:0,m:0},{d:3,h:12,m:0},{d:0,h:8,m:0},{d:7,h:0,m:0},{d:2,h:0,m:30}]),dns:pick([[SRVIP],pick(PUBDNS)]),dom:pick([DOMAIN,...DOMS])};},
 items:p=>{const sc=()=>S.dhcp.scopes.find(s=>scopeNet(s)===p.N.net);const no='범위 ['+p.N.net+']가 없습니다.';return [
  {t:`범위 이름 ${C(p.name)}`,f:()=>ok(sc()&&sc().name===p.name,sc()?'현재 '+sc().name:no)},
  {t:`주소 범위 ${C(p.s)} ~ ${C(p.e)}, 서브넷 마스크 ${maskTxt(p.N)}`,f:()=>{const s=sc();return ok(s&&s.start===p.s&&s.end===p.e&&s.mask===p.N.mask,s?`현재 ${s.start} ~ ${s.end} / ${s.mask}`:no);}},
  {t:`제외 범위 ${C(p.xs)} ~ ${C(p.xe)}`,f:()=>{const s=sc();return ok(s&&s.excl.some(x=>x.s===p.xs&&x.e===p.xe),s?'제외 범위: '+(s.excl.map(x=>x.s+'-'+x.e).join(', ')||'없음'):no);}},
  {t:`임대 기간 ${C(fmtLease(p.lease))}`,f:()=>{const s=sc();return ok(s&&!s.unl&&s.lease.d===p.lease.d&&s.lease.h===p.lease.h&&s.lease.m===p.lease.m,s?'현재 '+fmtLease(s.lease):no);}},
  {t:`라우터(기본 게이트웨이) ${C(p.N.first)}`,f:()=>{const s=sc();return ok(s&&(s.opts['003']||[])[0]===p.N.first,s?'현재 '+((s.opts['003']||[]).join(', ')||'없음'):no);}},
  {t:`DNS 서버 ${p.dns.map(C).join(', ')}, 부모 도메인 ${C(p.dom)}`,f:()=>{const s=sc();return ok(s&&JSON.stringify(s.opts['006']||[])===JSON.stringify(p.dns)&&lc(s.opts['015'])===p.dom,s?`현재 DNS ${(s.opts['006']||[]).join(', ')||'없음'}, 도메인 ${s.opts['015']||'없음'}`:no);}},
  {t:'범위 활성화',f:()=>ok(sc()&&sc().act,sc()?'범위가 비활성 상태입니다.':no)},
  ...(p.unauth?[{t:'DHCP 서버 권한 부여',f:()=>ok(S.dhcp.auth,'권한이 부여되지 않았습니다 (IPv4 아이콘이 빨간색).')}]:[])];},
 hint:p=>['서버 관리자 → 도구 → <b>DHCP</b> (또는 '+C('dhcpmgmt.msc')+')','<b>IPv4</b> 오른쪽 클릭 → <b>새 범위</b>','범위 이름 → 시작/끝 IP, 길이 또는 서브넷 마스크'+(p.N.showP?` (/${p.N.p} = ${p.N.mask})`:''),'제외 범위 [추가] → 임대 기간','"예, 지금 이 옵션을 구성합니다" → 라우터 → 도메인 이름 및 DNS 서버(기본으로 들어 있는 주소는 [제거]) → WINS → 범위 활성화',...(p.unauth?['서버(server.netlab.local) 오른쪽 클릭 → <b>권한 부여</b>. 권한이 없으면 범위를 만들어도 주소를 나눠 주지 않습니다.']:[])]},

{id:'dhcpres',cat:'DHCP',t:'예약 · 제외 · 범위 옵션',lead:'',
 gen:()=>{const N=genNet({p:24,bases:['192.168']});return {N,name:pick(['PRINTER-1','NAS','PC-01','CCTV']),rip:N.host(rnd(120,170)),mac:randMac(),xs:N.host(190),xe:N.host(200),dns:pick(PUBDNS)[0],ld:pick([1,3,14,30]),dom:pick(DOMS)};},
 setup:(st,p)=>{st.dhcp.scopes.push({name:'LAN',desc:'',start:p.N.host(100),end:p.N.host(200),mask:'255.255.255.0',excl:[],delay:0,lease:{d:8,h:0,m:0},unl:false,opts:{'003':[p.N.host(1)],'006':[SRVIP],'015':DOMAIN},res:[],act:true});},
 leadF:p=>`범위 [${p.N.net}] LAN (${p.N.host(100)} ~ ${p.N.host(200)})이 있습니다. 다음과 같이 설정하십시오.`,
 items:p=>{const sc=()=>S.dhcp.scopes.find(s=>scopeNet(s)===p.N.net);return [
  {t:`예약: 이름 ${C(p.name)}, IP ${C(p.rip)}, MAC ${C(p.mac)}`,f:()=>{const r=sc()?.res.find(x=>x.ip===p.rip);return ok(r&&r.name===p.name&&normMac(r.mac)===normMac(p.mac),r?`현재 ${r.name} / ${r.mac}`:'예약이 없습니다.');}},
  {t:`제외 범위 ${C(p.xs)} ~ ${C(p.xe)}`,f:()=>ok(sc()?.excl.some(x=>x.s===p.xs&&x.e===p.xe),'제외 범위가 없습니다.')},
  {t:`범위 옵션 006 DNS 서버에 ${C(p.dns)}를 두 번째로 추가 (기존 ${SRVIP} 유지)`,f:()=>{const v=sc()?.opts['006']||[];return ok(v[0]===SRVIP&&v[1]===p.dns,'현재 '+(v.join(', ')||'없음'));}},
  {t:`범위 옵션 015 DNS 도메인 이름을 ${C(p.dom)}(으)로 변경`,f:()=>ok(lc(sc()?.opts['015'])===p.dom,'현재 '+(sc()?.opts['015']||'없음'))},
  {t:`임대 기간 ${C(p.ld+'일')} (범위 속성)`,f:()=>{const l=sc()?.lease;return ok(l&&!sc().unl&&l.d===p.ld&&!l.h&&!l.m,l?'현재 '+fmtLease(l):'');}}];},
 hint:()=>['DHCP → IPv4 → 범위 펼치기','<b>예약</b> 오른쪽 클릭 → 새 예약 (MAC은 하이픈 없이 입력해도 됩니다)','<b>주소 풀</b> 오른쪽 클릭 → 새 제외 범위','<b>범위 옵션</b> 오른쪽 클릭 → 옵션 구성 → 006, 015 선택해 값 수정','범위 오른쪽 클릭 → 속성 → 임대 기간']},

{id:'site',cat:'IIS',t:'웹 사이트 추가',lead:'',
 gen:()=>{const v=pick(['port','host','stop']);return {v,name:pick(['webtest','mysite','company','homepage']),dir:pick(['web','webroot','www','site']),port:v==='port'?pick([8080,8000,8888]):80,host:v==='host'?'www.'+pick(DOMS):''};},
 setup:(st,p)=>{mkFolderAt(st,p.dir);},
 leadF:p=>`IIS에 새 웹 사이트를 추가하십시오. 콘텐츠 폴더 ${C('C:\\'+p.dir)}는 이미 있습니다.`,
 items:p=>{const s=()=>findSite(p.name);const no='사이트가 없습니다.';const it=[
  {t:`사이트 이름 ${C(p.name)}, 실제 경로 ${C('C:\\'+p.dir)}`,f:()=>ok(s()&&lc(s().path.replace(/\\+$/,''))===lc('C:\\'+p.dir),s()?'현재 경로 '+s().path:no)},
  {t:`바인딩: http, IP ${C(SRVIP)}, 포트 ${C(p.port)}${p.host?', 호스트 이름 '+C(p.host):''}`,f:()=>{const b=s()?.bind.find(b=>b.t==='http');return ok(b&&b.ip===SRVIP&&b.port===p.port&&lc(b.host)===lc(p.host),b?'현재 '+bindInfo(b):no);}}];
  it.push({t:`응용 프로그램 풀 ${C(p.name)} (사이트 이름과 같은 기본값)`,f:()=>ok(s()&&s().pool===p.name,s()?'현재 '+s().pool:no)});
  if(p.v==='stop')it.push({t:`포트 80을 쓰는 ${C('Default Web Site')} 중지 또는 제거`,f:()=>ok(!findSite('Default Web Site')?.on,'Default Web Site가 아직 시작됨 상태입니다.')});
  it.push({t:'새 사이트가 시작됨 상태',f:()=>ok(s()&&s().on,s()?'사이트가 중지되어 있습니다.':no)});return it;},
 hint:p=>['서버 관리자 → 도구 → <b>IIS(인터넷 정보 서비스) 관리자</b> (또는 '+C('inetmgr')+')','<b>사이트</b> 오른쪽 클릭 → <b>웹 사이트 추가</b>','사이트 이름, 실제 경로([...]로 선택), IP 주소 목록에서 '+SRVIP+', 포트'+(p.host?', 호스트 이름':''),p.v==='stop'?'Default Web Site를 먼저 선택해 오른쪽 작업 창에서 <b>중지</b>하거나, 오른쪽 클릭 → <b>제거</b>한 뒤 새 사이트를 시작합니다. (바인딩이 겹치면 한 사이트만 시작할 수 있습니다.)':'즉시 웹 사이트 시작 → 확인']},

{id:'iisdoc',cat:'IIS',t:'기본 문서 · 디렉터리 검색 · 연결 제한',lead:`${'Default Web Site'}를 다음과 같이 설정하십시오.`,
 gen:()=>({doc:pick(['main.html','index.php','home.htm','start.html']),to:pick([60,180,240,300]),cn:pick([100,200,500,1000])}),
 items:p=>{const s=()=>findSite('Default Web Site');return [
  {t:`기본 문서 ${C(p.doc)}를 추가하고 목록 맨 위에 두기`,f:()=>ok(lc(s()?.docs[0])===lc(p.doc),s()?.docs.some(d=>lc(d)===lc(p.doc))?'추가했지만 맨 위가 아닙니다. [위로 이동]을 쓰세요.':'목록에 없습니다.')},
  {t:`기본 문서 ${C('iisstart.htm')} 제거`,f:()=>ok(!s()?.docs.some(d=>lc(d)==='iisstart.htm'))},
  {t:'디렉터리 검색 사용',f:()=>ok(s()?.dirb,'디렉터리 검색이 사용 안 함 상태입니다.')},
  {t:`연결 시간 제한 ${C(p.to+'초')}`,f:()=>ok(s()?.lim.timeout===p.to,'현재 '+s()?.lim.timeout+'초')},
  {t:`연결 수 제한 ${C(p.cn)}`,f:()=>ok(s()?.lim.connOn&&s().lim.conn===p.cn,s()?.lim.connOn?'현재 '+s().lim.conn:'연결 수 제한 확인란이 꺼져 있습니다.')}];},
 hint:()=>['IIS 관리자 → 사이트 → Default Web Site','<b>기본 문서</b> 아이콘을 두 번 클릭 → 작업 창의 추가/제거/위로 이동','<b>디렉터리 검색</b> → 작업 창 [사용]','사이트를 다시 선택 → 작업 창 <b>구성 › 제한...</b>']},

{id:'iisip',cat:'IIS',t:'IP 주소 제한과 인증',lead:'Default Web Site에 접근 제한을 거십시오.',
 gen:()=>{const N=genNet({p:24,bases:['10.10','172.16']});return {N,usePfx:Math.random()<.5,deny:'192.168.100.'+rnd(50,99)};},
 items:p=>{const s=()=>findSite('Default Web Site');return [
  {t:'지정되지 않은 클라이언트에 대한 액세스: 거부',f:()=>ok(s()?.ipr.def==='deny','현재 허용')},
  {t:`허용 항목: IP 주소 범위 ${C(p.N.net)}, ${p.usePfx?'접두사 '+C(p.N.p):'마스크 '+C(p.N.mask)}`,f:()=>ok(s()?.ipr.rules.some(r=>r.mode==='allow'&&r.ip===p.N.net&&r.mask===p.N.mask),'일치하는 허용 항목이 없습니다.')},
  {t:`거부 항목: 특정 IP 주소 ${C(p.deny)}`,f:()=>ok(s()?.ipr.rules.some(r=>r.mode==='deny'&&r.ip===p.deny&&!r.mask),'일치하는 거부 항목이 없습니다.')},
  {t:'익명 인증 사용 안 함, 기본 인증 사용',f:()=>ok(s()&&!s().auth.anon&&s().auth.basic,s()?`익명 ${s().auth.anon?'사용':'사용 안 함'} / 기본 ${s().auth.basic?'사용':'사용 안 함'}`:'')}];},
 hint:()=>['IIS 관리자 → Default Web Site → <b>IP 주소 및 도메인 제한</b>','작업 창: 허용 항목 추가 / 거부 항목 추가 / <b>기능 설정 편집</b>(지정되지 않은 클라이언트 거부)','<b>인증</b> 아이콘 → 항목 선택 후 작업 창의 사용/사용 안 함']},

{id:'ftp',cat:'IIS',t:'FTP 사이트 추가',lead:'',
 gen:()=>{const v=pick(['anon','basic']);return {v,name:pick(['FTP-Site','DataFTP','ftpsvc']),dir:pick(['ftp','ftpdata','upload']),port:pick([21,21,2121])};},
 setup:(st,p)=>{mkFolderAt(st,p.dir);},
 leadF:p=>`IIS에 FTP 사이트를 추가하십시오. 폴더 ${C('C:\\'+p.dir)}는 이미 있습니다.`,
 items:p=>{const s=()=>S.iis.sites.find(x=>x.kind==='ftp'&&lc(x.name)===lc(p.name));const no='FTP 사이트가 없습니다.';return [
  {t:`FTP 사이트 이름 ${C(p.name)}, 실제 경로 ${C('C:\\'+p.dir)}`,f:()=>ok(s()&&lc(s().path.replace(/\\+$/,''))===lc('C:\\'+p.dir),s()?'현재 경로 '+s().path:no)},
  {t:`바인딩: IP ${C(SRVIP)}, 포트 ${C(p.port)}, 자동 시작`,f:()=>{const b=s()?.bind[0];return ok(b&&b.ip===SRVIP&&b.port===p.port&&s().on,b?`현재 ${bindInfo(b)}${s().on?'':' (중지됨)'}`:no);}},
  {t:'SSL 없음',f:()=>ok(s()?.ssl==='none',s()?'현재 '+({allow:'허용',require:'필요'})[s().ssl]:no)},
  p.v==='anon'?{t:'인증: 익명만 사용 (기본 인증 사용 안 함)',f:()=>ok(s()&&s().fauth.anon&&!s().fauth.basic)}:{t:'인증: 기본만 사용 (익명 사용 안 함)',f:()=>ok(s()&&!s().fauth.anon&&s().fauth.basic)},
  p.v==='anon'?{t:'권한 부여: 익명 사용자에게 읽기 허용 (쓰기 없음)',f:()=>ok(s()?.authz.some(r=>r.mode==='allow'&&r.who==='anon'&&r.r&&!r.w),'일치하는 권한 부여 규칙이 없습니다.')}:{t:'권한 부여: 모든 사용자에게 읽기·쓰기 허용',f:()=>ok(s()?.authz.some(r=>r.mode==='allow'&&r.who==='all'&&r.r&&r.w),'일치하는 권한 부여 규칙이 없습니다.')}];},
 hint:()=>['IIS 관리자 → <b>사이트</b> 오른쪽 클릭 → <b>FTP 사이트 추가</b>','사이트 정보 → 바인딩 및 SSL 설정 (IP, 포트, SSL 없음)','인증 및 권한 부여: 인증 방식 확인란, 액세스 허용 대상, 읽기/쓰기']},

{id:'aduser',cat:'Active Directory',t:'조직 구성 단위와 사용자 만들기',lead:'',
 gen:()=>{const [l,f]=pick(KNAMES);const v=pick(['never','must']);return {ou:pick(OUS),l,f,logon:pick(LOGONS),pw:pick(['P@ssw0rd','Net!2345','Admin#2026']),v};},
 leadF:p=>`도메인 ${C(DOMAIN)}에 조직 구성 단위(OU)와 사용자를 만드십시오.`,
 items:p=>{const u=()=>S.ad.users.find(x=>lc(x.logon)===lc(p.logon));const no='사용자가 없습니다.';const it=[
  {t:`도메인 바로 아래 조직 구성 단위 ${C(p.ou)}`,f:()=>ok(S.ad.ous.some(o=>o.name===p.ou&&o.parent===''),'OU가 없습니다.')},
  {t:`${C(p.ou)} 안에 사용자 성 ${C(p.l)}, 이름 ${C(p.f)} (전체 이름 ${C(p.l+p.f)})`,f:()=>ok(u()&&u().c==='ou:'+p.ou&&u().last===p.l&&u().first===p.f,u()?(u().c!=='ou:'+p.ou?'사용자가 '+cName(u().c)+'에 있습니다.':'성/이름이 다릅니다.'):no)},
  {t:`사용자 로그온 이름(UPN) ${C(p.logon+'@'+DOMAIN)}, Windows 2000 이전 버전 ${C('NETLAB\\'+p.logon)}`,f:()=>ok(u()&&lc(u().pre||u().logon)===lc(p.logon),u()?'현재 NETLAB\\'+u().pre:no)},
  {t:`암호 ${C(p.pw)}`,f:()=>ok(u()&&u().pw===p.pw,u()?'암호가 다릅니다.':no)}];
  if(p.v==='never')it.push({t:'다음 로그온할 때 반드시 암호 변경: 해제',f:()=>ok(u()&&!u().mustChange,no)},{t:'암호 사용 기간 제한 없음: 선택',f:()=>ok(u()?.neverExp,no)});
  else it.push({t:'다음 로그온할 때 반드시 암호 변경: 선택',f:()=>ok(u()?.mustChange,no)},{t:'계정 사용 안 함: 선택',f:()=>ok(u()?.disabled,no)});
  return it;},
 hint:()=>['서버 관리자 → 도구 → <b>Active Directory 사용자 및 컴퓨터</b> (또는 '+C('dsa.msc')+')','도메인 오른쪽 클릭 → 새로 만들기 → <b>조직 구성 단위</b>','만든 OU 오른쪽 클릭 → 새로 만들기 → <b>사용자</b>','암호 화면에서 확인란을 고릅니다. 기본으로 선택된 "다음 로그온할 때 반드시 암호 변경"을 확인하세요.']},

{id:'adgroup',cat:'Active Directory',t:'그룹 만들기와 구성원 추가',lead:'',
 gen:()=>({ou:pick(OUS),g:pick(['Sales_G','DevTeam','HR-Group','NetAdmins']),scope:pick(['global','local','universal']),type:pick(['security','security','dist']),u1:'user'+rnd(10,49),u2:'user'+rnd(50,99),ph:`02-${rnd(100,999)}-${rnd(1000,9999)}`}),
 setup:(st,p)=>{st.ad.ous.push({name:p.ou,parent:'',protect:true,desc:''});addUser(st,{logon:p.u1,full:p.u1,c:'ou:'+p.ou});addUser(st,{logon:p.u2,full:p.u2,c:'ou:'+p.ou});},
 leadF:p=>`OU ${C(p.ou)}에 사용자 ${C(p.u1)}, ${C(p.u2)}가 있습니다.`,
 items:p=>{const g=()=>S.ad.groups.find(x=>lc(x.name)===lc(p.g));const u=n=>S.ad.users.find(x=>x.logon===n);return [
  {t:`${C(p.ou)} 안에 그룹 ${C(p.g)}`,f:()=>ok(g()&&g().c==='ou:'+p.ou,g()?'그룹 위치가 '+cName(g().c)+'입니다.':'그룹이 없습니다.')},
  {t:`그룹 범위: ${SCOPE[p.scope]}, 그룹 종류: ${p.type==='security'?'보안':'배포'}`,f:()=>ok(g()&&g().scope===p.scope&&g().type===p.type,g()?`현재 ${gType(g())}`:'그룹이 없습니다.')},
  {t:`${C(p.u1)}, ${C(p.u2)}를 그룹 구성원으로 추가`,f:()=>ok(u(p.u1)?.groups.includes(g()?.name)&&u(p.u2)?.groups.includes(g()?.name),'구성원이 모두 들어 있지 않습니다.')},
  {t:`${C(p.u1)}의 전화 번호 ${C(p.ph)}`,f:()=>ok(u(p.u1)?.phone===p.ph,'현재 '+(u(p.u1)?.phone||'없음'))}];},
 hint:()=>['AD 사용자 및 컴퓨터 → OU 오른쪽 클릭 → 새로 만들기 → <b>그룹</b>','사용자 오른쪽 클릭 → <b>그룹에 추가</b> (또는 그룹 속성 → 구성원 → 추가)','이름 입력 후 [이름 확인] → 확인','사용자 속성 → 일반 탭 → 전화 번호']},

{id:'pwpol',cat:'보안 정책',t:'암호 정책과 계정 잠금 정책',lead:'로컬 보안 정책을 다음과 같이 설정하십시오.',
 gen:()=>{const d=pick([10,15,30]);return {len:pick([8,10,12]),max:pick([30,60,90]),min:pick([1,2,3]),hist:pick([5,10,12]),thr:pick([3,5,10]),dur:d,rs:pick([5,10,d].filter(x=>x<=d))};},
 items:p=>[
  {t:`최소 암호 길이 ${C(p.len+' 문자')}`,f:()=>ok(S.sec.minLen===p.len,'현재 '+S.sec.minLen)},
  {t:`최대 암호 사용 기간 ${C(p.max+'일')}, 최소 암호 사용 기간 ${C(p.min+'일')}`,f:()=>ok(S.sec.maxAge===p.max&&S.sec.minAge===p.min,`현재 ${S.sec.maxAge}일 / ${S.sec.minAge}일`)},
  {t:`최근 암호 기억 ${C(p.hist+'개')}`,f:()=>ok(S.sec.hist===p.hist,'현재 '+S.sec.hist)},
  {t:'암호는 복잡성을 만족해야 함: 사용',f:()=>ok(S.sec.cplx)},
  {t:`계정 잠금 임계값 ${C(p.thr+'번')}, 잠금 기간 ${C(p.dur+'분')}, 잠금 수 원래대로 설정 ${C(p.rs+'분')}`,f:()=>ok(S.sec.lockThr===p.thr&&S.sec.lockDur===p.dur&&S.sec.lockReset===p.rs,`현재 ${S.sec.lockThr}번 / ${S.sec.lockDur??'-'}분 / ${S.sec.lockReset??'-'}분`)},
  {t:'로그온 이벤트 감사: 성공, 실패',f:()=>ok(S.sec.audit.logon.s&&S.sec.audit.logon.f,'현재 '+audTxt(S.sec.audit.logon))}],
 hint:()=>['서버 관리자 → 도구 → <b>로컬 보안 정책</b> (또는 '+C('secpol.msc')+')','계정 정책 → 암호 정책 / 계정 잠금 정책 → 항목 두 번 클릭','계정 잠금 임계값을 먼저 설정하면 나머지 두 항목이 30분으로 제안됩니다. 그다음 값을 고칩니다.','로컬 정책 → 감사 정책 → 로그온 이벤트 감사','같은 설정을 <b>그룹 정책 관리</b>('+C('gpmc.msc')+') → Default Domain Policy 오른쪽 클릭 → 편집 → 컴퓨터 구성 › 정책 › Windows 설정 › 보안 설정에서도 바꿀 수 있습니다. 실제 도메인 컨트롤러에서는 이쪽이 도메인 암호 정책입니다.']},

{id:'share',cat:'파일 공유',t:'폴더 공유와 공유 권한',lead:'',
 gen:()=>{const f=pick(['Data','Share','Docs','Public']);const hid=Math.random()<.4;return {f,sn:hid?f+'$':f+'_share',hid,lim:pick([5,10,20]),desc:pick(['부서 자료','공용 문서','백업 자료'])};},
 setup:(st,p)=>{mkFolderAt(st,p.f);},
 leadF:p=>`폴더 ${C('C:\\'+p.f)}를 네트워크에 공유하십시오.`,
 items:p=>{const sh=()=>findFolder(p.f)?.share;const no='폴더가 공유되지 않았습니다.';const pe=w=>sh()?.perms.find(x=>lc(x.who)===lc(w));return [
  {t:`공유 이름 ${C(p.sn)}${p.hid?' (숨김 공유)':''}`,f:()=>ok(sh()&&sh().name===p.sn,sh()?'현재 '+sh().name:no)},
  {t:`동시 사용자 수 제한 ${C(p.lim)}`,f:()=>ok(sh()?.limit===p.lim,sh()?'현재 '+sh().limit:no)},
  {t:`설명 ${C(p.desc)}`,f:()=>ok(sh()&&sh().desc.trim()===p.desc,sh()?'현재 "'+sh().desc+'"':no)},
  {t:`공유 권한: Everyone 읽기만 허용`,f:()=>{const e=pe('Everyone');return ok(e&&e.a.read&&!e.a.change&&!e.a.full,e?'Everyone 권한이 읽기만이 아닙니다.':'Everyone 항목이 없습니다.');}},
  {t:`공유 권한: Administrators 모든 권한 허용`,f:()=>{const e=pe('Administrators');return ok(e&&e.a.full,e?'모든 권한이 허용되지 않았습니다.':'Administrators 항목이 없습니다.');}}];},
 hint:()=>['파일 탐색기(내 PC) → 로컬 디스크 (C:) → 폴더 오른쪽 클릭 → <b>속성</b>','<b>공유</b> 탭 → <b>고급 공유</b> → 선택한 폴더 공유','공유 이름, 동시 사용자 수, 설명 → <b>권한</b>','[추가]에서 Administrators 입력 → 이름 확인 → 모든 권한 허용']},

{id:'ntfs',cat:'파일 공유',t:'NTFS 보안 권한',lead:'',
 gen:()=>({f:pick(['Project','Account','HRdocs']),u:pick(LOGONS)}),
 setup:(st,p)=>{mkFolderAt(st,p.f);addUser(st,{logon:p.u,full:p.u});},
 leadF:p=>`폴더 ${C('C:\\'+p.f)}의 보안(NTFS) 권한을 설정하십시오. 도메인 사용자 ${C(p.u)}가 있습니다.`,
 items:p=>{const f=()=>findFolder(p.f);return [
  {t:`${C(p.u)}에게 수정 권한 허용`,f:()=>{const e=aclOf(f(),p.u);return ok(e&&e.a.modify,e?'수정 권한이 허용되지 않았습니다.':'사용자가 목록에 없습니다.');}},
  {t:`${C(p.u)}의 모든 권한은 허용하지 않음`,f:()=>{const e=aclOf(f(),p.u);return ok(e&&!e.a.full,e?'모든 권한까지 허용되어 있습니다.':'사용자가 목록에 없습니다.');}},
  {t:`${C('Users')} 그룹에 쓰기 거부`,f:()=>ok(aclOf(f(),'Users')?.d.write,'Users의 쓰기 거부가 선택되지 않았습니다.')}];},
 hint:p=>['파일 탐색기 → '+C('C:\\'+p.f)+' 속성 → <b>보안</b> 탭 → <b>편집</b>','[추가] → 사용자 이름 입력 → 이름 확인','사용자 선택 → 수정 허용, Users 선택 → 쓰기 거부 → 확인']},

{id:'fw',cat:'방화벽',t:'인바운드 규칙 만들기',lead:'',
 gen:()=>{const pr=pick(['TCP','TCP','UDP']);return {name:pick(['WebApp-In','Custom-Service','App-Port']),pr,port:pr==='TCP'?pick(['8080','3306','1433','5000-5010']):pick(['514','161','69']),act:pick(['allow','block'])};},
 leadF:p=>'고급 보안이 포함된 Windows 방화벽에서 다음을 설정하십시오.',
 items:p=>{const r=()=>S.fw.rules.find(x=>x.dir==='in'&&x.name===p.name);const no='규칙이 없습니다.';return [
  {t:`인바운드 규칙 이름 ${C(p.name)}, 사용`,f:()=>ok(r()&&r().on,r()?'규칙이 사용 안 함 상태입니다.':no)},
  {t:`프로토콜 ${C(p.pr)}, 특정 로컬 포트 ${C(p.port)}`,f:()=>ok(r()&&r().proto===p.pr&&r().port===p.port,r()?`현재 ${r().proto} ${r().port||'모든 포트'}`:no)},
  {t:`작업: ${p.act==='allow'?'연결 허용':'연결 차단'}`,f:()=>ok(r()?.act===p.act,no)},
  {t:'프로필: 도메인, 개인만 (공용 제외)',f:()=>ok(r()&&r().prof.domain&&r().prof.private&&!r().prof.public,r()?'현재 '+profTxt(r().prof):no)},
  {t:`ping 응답 허용: ${C('파일 및 프린터 공유(에코 요청 - ICMPv4-In)')} 규칙 사용`,f:()=>ok(S.fw.rules.find(x=>x.name==='파일 및 프린터 공유(에코 요청 - ICMPv4-In)')?.on,'규칙이 사용 안 함 상태입니다.')}];},
 hint:()=>['서버 관리자 → 도구 → <b>고급 보안이 포함된 Windows 방화벽</b> (또는 '+C('wf.msc')+')','<b>인바운드 규칙</b> 오른쪽 클릭 → 새 규칙 → <b>포트</b>','TCP/UDP, 특정 로컬 포트 → 작업 → 프로필(공용 해제) → 이름','목록에서 에코 요청 규칙 오른쪽 클릭 → <b>규칙 사용</b>']},

{id:'rdp',cat:'시스템',t:'원격 데스크톱 허용과 컴퓨터 이름',lead:'',
 gen:()=>({n:pick(['WEB-SRV','DC01','NETSRV','SRV2016']),nla:Math.random()<.5,u:pick(LOGONS)}),
 setup:(st,p)=>{addUser(st,{logon:p.u,full:p.u});},
 leadF:p=>`도메인 사용자 ${C(p.u)}가 있습니다. 시스템 속성에서 다음을 설정하십시오.`,
 items:p=>[
  {t:'이 컴퓨터에 대한 원격 연결 허용',f:()=>ok(S.sys.rdp,'원격 연결이 허용되지 않았습니다.')},
  {t:`네트워크 수준 인증 확인란: ${p.nla?'선택':'해제'}`,f:()=>ok(S.sys.rdp&&S.sys.nla===p.nla)},
  {t:`원격 데스크톱 사용자에 ${C(p.u)} 추가`,f:()=>ok(S.sys.rdpUsers.some(x=>lc(x)===lc(p.u)),'목록에 없습니다.')},
  {t:'원격 지원 연결 허용: 해제',f:()=>ok(!S.sys.ra)},
  {t:`컴퓨터 이름을 ${C(p.n)}(으)로 변경 (다시 시작 대기)`,f:()=>ok(S.sys.pending===p.n,'현재 '+(S.sys.pending||S.sys.name))}],
 hint:()=>['실행 창에 '+C('sysdm.cpl')+' (또는 서버 관리자 → 로컬 서버 → 원격 데스크톱)','<b>원격</b> 탭 → 원격 연결 허용, NLA 확인란, [사용자 선택] → 추가','<b>컴퓨터 이름</b> 탭 → [변경] → 새 이름 → 확인 → 다시 시작 안내 확인','시스템 속성 창에서 <b>확인</b>(또는 적용)을 눌러야 원격 설정이 저장됩니다.']},

{id:'cmd',cat:'명령 프롬프트',t:'네트워크 명령어',lead:'명령 프롬프트에서 다음 작업을 하는 명령을 실행하십시오.',
 gen:()=>{const pool=[
   ['DNS 확인자 캐시를 비우기',['ipconfig /flushdns']],['DNS 확인자 캐시 내용 보기',['ipconfig /displaydns']],['MAC 주소와 DNS 서버까지 포함한 자세한 IP 구성 보기',['ipconfig /all']],
   ['라우팅 테이블 보기',['route print','netstat /r']],['모든 연결과 수신 대기 포트를 숫자 형식으로 보기',['netstat /an','netstat /na','netstat /a /n','netstat /n /a']],['ARP 캐시 보기',['arp /a','arp /g']],
   ['DNS에 이 컴퓨터 이름을 다시 등록하기',['ipconfig /registerdns']],['컴퓨터 이름 확인',['hostname']],['이 서버의 공유 폴더 목록 보기',['net share']],
   ['8.8.8.8로 에코 요청을 6번 보내기',['ping /n 6 8.8.8.8','ping 8.8.8.8 /n 6']],['8.8.8.8까지 거치는 라우터 경로 추적',['tracert 8.8.8.8']],['www.google.com의 IP 주소를 DNS에 질의',['nslookup www.google.com']]];
   return {q:shuffle(pool).slice(0,4)};},
 items:p=>p.q.map(([q,a])=>({t:q,f:()=>{const norm=s=>s.replace(/\s+/g,' ').trim().replace(/^(ipconfig|netstat|arp|route|ping|nslookup|tracert)\s+-/,(m,x)=>x+' /').replace(/ -/g,' /');return ok(S.cmd.log.some(l=>a.includes(norm(l))),'아직 실행하지 않았습니다.');}})),
 hint:p=>['바탕 화면 <b>명령 프롬프트</b> 또는 실행 창에 '+C('cmd'),...p.q.map(([q,a])=>q+': '+C(a[0].replace(/\/(n|a|r|g)\b/g,'-$1').replace('-n 6','-n 6')))]},
];
</script>
<script>
/* ================= 과제 패널 ================= */
let CUR=null,P=null,RES=null,SHOWH=false;
const done=LS.get('done',{});
function startTask(id,keepP){
  CUR=TASKS.find(t=>t.id===id)||TASKS[1];
  if(!keepP)P=CUR.gen();
  S=baseState();CUR.setup&&CUR.setup(S,P);
  RES=null;SHOWH=false;
  closeAll();renderDesk();renderPanel();LS.set('cur',CUR.id);
}
function grade(){
  RES=CUR.items(P).map(it=>{let r;try{r=it.f();}catch(e){r='설정을 찾을 수 없습니다.';}return r===true?{ok:true}:{ok:false,why:typeof r==='string'?r:''};});
  if(RES.length&&RES.every(r=>r.ok)){done[CUR.id]=true;LS.set('done',done);}
  renderPanel();
}
function renderPanel(){
  const card=$('#taskCard');const items=CUR.items(P);
  const n=RES?RES.filter(r=>r.ok).length:0;
  card.replaceChildren(...[
    h('span',{class:'chip'},CUR.cat),h('h2',null,CUR.t),
    h('p',{class:'lead',html:CUR.leadF?CUR.leadF(P):CUR.lead}),
    items.length?h('ol',{class:'req'},items.map((it,i)=>h('li',{class:RES?(RES[i].ok?'ok':'no'):''},h('span',{html:it.t}),RES&&!RES[i].ok?h('div',{class:'cmp'},h('span',{class:'k'},'기대 값'),h('span',{html:it.t}),h('span',{class:'k'},'현재 값'),h('span',{class:'v'},(RES[i].why||'요구 조건을 만족하지 않습니다.').replace(/^현재\s*/,''))):null))):null,
    RES&&items.length?h('div',{class:'score'+(n===items.length?' all':'')},n===items.length?h('b',null,`모두 맞았습니다. ${n} / ${items.length}`):[h('b',null,`${n} / ${items.length}`),' 항목 완료. 빨간 항목을 고친 뒤 다시 채점하세요.']):null,
    h('div',{class:'acts'},items.length?h('button',{class:'btn pri',type:'button',onclick:grade},'채점하기'):null,
      h('button',{class:'btn',type:'button',onclick:()=>{SHOWH=!SHOWH;renderPanel();}},SHOWH?'풀이 숨기기':'풀이 보기'),
      CUR.id!=='free'?h('button',{class:'btn',type:'button',onclick:()=>startTask(CUR.id)},'새 문제'):null,
      h('button',{class:'btn',type:'button',onclick:()=>startTask(CUR.id,true)},'처음부터')),
    SHOWH?h('div',{class:'hint'},h('b',null,'풀이 순서'),h('ol',null,CUR.hint(P).map(s=>h('li',{html:s})))):null].filter(Boolean));
  const tl=$('#taskList');tl.replaceChildren();let cat='';
  TASKS.forEach(t=>{if(t.cat!==cat){cat=t.cat;tl.append(h('div',{class:'cat'},cat));}
    tl.append(h('button',{type:'button',class:(t===CUR?'cur ':'')+(done[t.id]?'done':''),onclick:()=>{startTask(t.id);if(innerWidth<1100)$('#desk').scrollIntoView({behavior:'smooth',block:'start'});}},h('span',{class:'st'}),t.t));});
  const real=TASKS.filter(t=>t.id!=='free');$('#prog').textContent=`완료 ${real.filter(t=>done[t.id]).length} / ${real.length}`;
}
$('#refTable').append(...RUNCMD.map(([c,,d])=>h('tr',null,h('td',null,h('code',null,c)),h('td',null,d))),h('tr',null,h('td',null,h('code',null,'control')),h('td',null,'제어판 (이 연습장에서는 지원하지 않음)')));
startTask(LS.get('cur','ip'));
</script>
