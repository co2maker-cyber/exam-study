<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리눅스 서버 실습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 왼쪽은 CentOS 7 서버에 SSH로 붙은 터미널(아래에 터치용 특수 키 줄), 오른쪽은 과제·채점 패널. 좁은 화면에서는 위아래로 쌓는다. */
:root{
  --bg:#EFEDF3; --surface:#FFFFFF; --sunk:#E6E2EE; --line:#D2CCDD;
  --fg:#1A1622; --muted:#5E5770; --accent:#6A3D9A; --accent-ink:#FFFFFF;
  --ok:#1D8F53; --warn:#A86F08; --bad:#BE3B34;
  --t-bg:#14121A; --t-fg:#D9D6E0; --t-dim:#7D7790; --t-dir:#7AA9F2; --t-exe:#8FD18A; --t-lnk:#62D0D6; --t-arc:#F08A8A; --t-hi:#E7C36E; --t-err:#F2847B; --t-edge:#2A2533; --t-key:#1E1A26;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,"D2Coding",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#100E15; --surface:#18151F; --sunk:#13111A; --line:#2C2738;
  --fg:#E6E2EE; --muted:#9A92AC; --accent:#B892EA; --accent-ink:#1E0F33;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; --t-edge:#2C2738; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100E15; --surface:#18151F; --sunk:#13111A; --line:#2C2738;
  --fg:#E6E2EE; --muted:#9A92AC; --accent:#B892EA; --accent-ink:#1E0F33;
  --ok:#3CC97E; --warn:#E3B13F; --bad:#EE6A61; --t-edge:#2C2738; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.logo{width:34px;height:34px;flex:none;border-radius:7px;background:var(--t-bg);display:grid;place-items:center;font-family:var(--mono);font-weight:600;color:var(--t-exe);font-size:14px}
.top h1{margin:0;font-size:19px;letter-spacing:-.01em}
.top p{margin:0;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding-block:16px 32px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h2{margin:0;font-size:18px;line-height:1.35;text-wrap:balance}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.chip{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.03em;color:var(--accent);margin-bottom:4px}
.lead{color:var(--muted);font-size:14px;margin:6px 0 10px}
.req{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;counter-reset:r}
.req li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px;counter-increment:r}
.req li::before{content:counter(r);font-size:11px;font-weight:700;width:20px;height:20px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;margin-top:1px;font-variant-numeric:tabular-nums}
.req li.ok::before{content:"✓";background:var(--ok);color:var(--surface)}
.req li.no::before{content:"✗";background:var(--bad);color:var(--surface)}
.req code,.hint code,.ref code{font-family:var(--mono);font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.req .cmp{grid-column:2;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px;background:var(--sunk);border-radius:6px;padding:6px 8px;margin-top:2px;min-width:0}
.req .cmp .k{color:var(--muted);font-weight:700;white-space:nowrap}
.req .cmp .v{color:var(--bad);min-width:0;overflow-wrap:anywhere;font-family:var(--mono);font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 13px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.tl button:focus-visible,.keys button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.score.all{color:var(--ok)}
.hint{margin-top:12px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.hint li.cmd{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.hint ol{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tl{display:flex;flex-direction:column;gap:2px;max-height:520px;overflow:auto;margin:0 -6px}
.tl .cat{font-size:12px;font-weight:700;color:var(--muted);padding:10px 6px 4px;letter-spacing:.04em}
.tl button{display:grid;grid-template-columns:18px 1fr;gap:8px;text-align:left;border:0;background:none;padding:6px;border-radius:6px;font-size:14px}
.tl button:hover{background:var(--sunk)}
.tl button.cur{background:var(--sunk);font-weight:700}
.tl .st{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:3px}
.tl .done .st{background:var(--ok);border-color:var(--ok)}
.ref summary{cursor:pointer;font-weight:700;font-size:14px}
.ref table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
.ref td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
.ref td:first-child{white-space:nowrap}
.stage{min-width:0}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}

/* 터미널 */
.term{position:relative;height:620px;background:var(--t-bg);color:var(--t-fg);border:1px solid var(--t-edge);border-radius:10px;font-family:var(--mono);font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;overflow:hidden}
@media (max-width:700px){.term{height:560px;font-size:12.5px}}
.tbar{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--t-key);border-bottom:1px solid var(--t-edge);color:var(--t-dim);font-size:12px;flex:none}
.tbar i{width:10px;height:10px;border-radius:50%;background:#4A4357;display:inline-block}
.tbar span{margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scr{flex:1;overflow:auto;padding:8px 12px 12px;white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text}
.scr .ln{min-height:1.45em}
.inl{display:flex;align-items:baseline;flex-wrap:wrap}
.inl input{flex:1;min-width:40px;background:transparent;border:0;outline:none;color:var(--t-fg);font:inherit;padding:0;caret-color:var(--t-hi)}
.c-dir{color:var(--t-dir);font-weight:600}.c-exe{color:var(--t-exe);font-weight:600}.c-lnk{color:var(--t-lnk);font-weight:600}.c-arc{color:var(--t-arc);font-weight:600}
.c-hi{color:var(--t-hi)}.c-err{color:var(--t-err)}.c-dim{color:var(--t-dim)}.c-ok{color:var(--t-exe)}.c-sw{background:#3B6E3B;color:#fff}.c-st{background:var(--t-dir);color:#000}
.keys{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.keys button{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-width:42px}
.keys button:hover{border-color:var(--accent)}
/* vi */
.vi{position:absolute;inset:33px 0 0 0;background:var(--t-bg);display:flex;flex-direction:column;outline:none}
.vi .vb{flex:1;overflow:hidden;padding:4px 12px 0;white-space:pre}
.vi .vl{min-height:1.45em;overflow:hidden}
.vi .nu{color:var(--t-hi);display:inline-block;text-align:right;margin-right:1ch}
.vi .tld{color:var(--t-dir)}
.vi .cur{background:var(--t-fg);color:var(--t-bg)}
.vi .vs{flex:none;padding:2px 12px 6px;min-height:1.6em;white-space:pre;display:flex;gap:10px}
.vi .vs b{font-weight:600}
.vi .vs .r{margin-left:auto;color:var(--t-dim)}
.vi textarea{position:absolute;opacity:0;width:1px;height:1px;left:0;bottom:0;border:0;padding:0;resize:none}
.xnav{display:flex;gap:4px;flex-wrap:wrap;width:100%;font-size:13px;margin-bottom:-4px}
.xnav a{color:var(--muted);text-decoration:none;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.xnav a:hover{color:inherit}.xnav a.on{color:inherit;font-weight:700}
</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
<nav class="xnav" aria-label="사이트"><a href="../index.html">← 학습 홈</a><a href="../router/">라우터</a><a href="../windows/">윈도우</a><a href="../linux/" class="on">리눅스</a></nav>
  <div class="logo" aria-hidden="true">$_</div>
  <div><h1>리눅스 서버 실습장</h1><p>네트워크관리사 2급 실기 · CentOS 7 명령어와 설정 파일 연습</p></div>
  <div class="sp"></div>
  <span class="pill" id="prog">완료 0 / 0</span>
</div></header>
<main class="wrap layout">
  <section class="stage">
    <div class="term" id="term">
      <div class="tbar"><i></i><i></i><i></i><span id="ttl">root@server:~ — ssh</span></div>
      <div class="scr" id="scr" aria-live="polite"><div id="out"></div><div class="inl" id="inl"><span id="ps1"></span><input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="명령 입력"></div></div>
    </div>
    <div class="keys" id="keys" aria-label="특수 키"></div>
    <p class="note">아무 데나 입력하면 터미널로 들어갑니다. <b>Tab</b> 자동 완성, <b>↑ ↓</b> 이전 명령, <b>Ctrl+C</b> 취소, <b>Ctrl+L</b> 화면 지우기. 명령어 목록은 <code>help</code>, 명령 설명은 <code>man 명령</code>으로 봅니다. vi에서 Esc 키가 없으면 아래 <b>Esc</b> 단추를 누르세요.</p>
  </section>
  <aside class="side">
    <div class="card" id="taskCard"></div>
    <div class="card"><h3>과제 목록</h3><div class="tl" id="taskList"></div></div>
    <details class="card ref"><summary>자주 쓰는 설정 파일</summary><table id="refTable"></table></details>
  </aside>
</main>
<script>
'use strict';
/* ================= 도우미 ================= */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);if(props)for(const k in props){const v=props[k];if(v==null||v===false)continue;
  if(k==='class')el.className=v;else if(k==='html')el.innerHTML=v;else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2).toLowerCase(),v);else el.setAttribute(k,v===true?'':v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)));}return el;}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const clone=o=>JSON.parse(JSON.stringify(o));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LS={get(k,d){try{const v=localStorage.getItem('lxlab.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('lxlab.'+k,JSON.stringify(v));}catch(e){}}};
function ip2n(s){const p=String(s??'').trim().split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x)||+x>255)return null;n=n*256+(+x);}return n;}
const n2ip=n=>[n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
const isIP=s=>ip2n(s)!=null;
const pfx2mask=p=>n2ip(p<=0?0:(0xFFFFFFFF<<(32-p))>>>0);
function mask2pfx(m){const n=ip2n(m);if(n==null)return null;let p=0;while(p<32&&((n>>>(31-p))&1))p++;return ip2n(pfx2mask(p))===n?p:null;}
const netOf=(ip,p)=>n2ip((ip2n(ip)&ip2n(pfx2mask(p)))>>>0);
const NOW=()=>Date.now();
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const lsDate=t=>{const d=new Date(t);return `${MON[d.getMonth()]} ${String(d.getDate()).padStart(2)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const ctime=t=>{const p=new Date(t).toString().split(' ');return `${p[0]} ${p[1]} ${p[2]} ${p[4]} ${p[3]}`;};
const dayNo=()=>Math.floor(NOW()/864e5);
const uuid=()=>'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);});

/* ================= 파일 시스템 ================= */
const D=(mode=0o755,uid=0,gid=0)=>({t:'d',mode,uid,gid,mtime:NOW(),kids:{}});
const F=(data='',mode=0o644,uid=0,gid=0)=>({t:'f',mode,uid,gid,mtime:NOW(),data});
const L=target=>({t:'l',mode:0o777,uid:0,gid:0,mtime:NOW(),target});
function normPath(p,cwd){
  if(p==null)p='';
  if(p==='~'||p.startsWith('~/'))p=homeOf(S.user)+p.slice(1);
  else if(/^~[a-z_]/.test(p)){const m=p.match(/^~([^/]+)(.*)$/);const u=S.users.find(x=>x.name===m[1]);if(u)p=u.home+m[2];}
  const abs=p.startsWith('/')?p:(cwd||S.cwd)+'/'+p;
  const out=[];for(const part of abs.split('/')){if(!part||part==='.')continue;if(part==='..')out.pop();else out.push(part);}
  return '/'+out.join('/');
}
const dirname=p=>{const i=p.lastIndexOf('/');return i<=0?'/':p.slice(0,i);};
const basename=p=>p==='/'?'/':p.slice(p.lastIndexOf('/')+1);
function mountAt(path){const m=S.mounts.find(m=>m.dir===path);return m?S.disks[m.dev].root:null;}
function lookup(path,follow=true,depth=0){
  if(depth>20)return null;
  const abs=normPath(path);
  let node=S.fs,cur='',parent=null,name='/';
  const parts=abs.split('/').filter(Boolean);
  const mr=mountAt('/');if(mr)node=mr;
  for(let i=0;i<parts.length;i++){
    if(node.t!=='d')return null;
    const ch=node.kids[parts[i]];if(!ch)return null;
    parent=node;name=parts[i];cur+='/'+parts[i];
    if(ch.t==='l'&&(follow||i<parts.length-1)){const tgt=ch.target.startsWith('/')?ch.target:dirname(cur)+'/'+ch.target;const r=lookup(normPath(tgt,'/')+(i<parts.length-1?'/'+parts.slice(i+1).join('/'):''),follow,depth+1);if(!r)return null;return {...r,path:abs,viaLink:true};}
    node=ch;
    if(node.t==='d'){const m=mountAt(cur);if(m)node=m;}
  }
  return {node,parent,name,path:abs};
}
const exists=p=>!!lookup(p);
const isDir=p=>{const r=lookup(p);return r&&r.node.t==='d';};
function readFile(p){const r=lookup(p);if(!r)return null;const n=r.node;if(n.t!=='f')return null;return n.gen?n.gen():(n.data??'');}
function writeFile(p,data,o={}){
  const abs=normPath(p);let r=lookup(abs);
  if(r&&r.node.t==='d')return 'dir';
  if(r){const n=r.node;if(n.save)n.save(data);else{if(o.append)n.data=(n.gen?n.gen():(n.data||''))+data;else n.data=data;delete n.arch;delete n.gz;}n.mtime=NOW();return null;}
  const pd=lookup(dirname(abs));if(!pd||pd.node.t!=='d')return 'nodir';
  const me=curUser();pd.node.kids[basename(abs)]=F(data,0o666&~S.umask,me.uid,me.gid);pd.node.mtime=NOW();return null;
}
function put(path,node){const parts=path.split('/').filter(Boolean);let d=S.fs;for(let i=0;i<parts.length-1;i++){if(!d.kids[parts[i]])d.kids[parts[i]]=D();d=d.kids[parts[i]];}d.kids[parts[parts.length-1]]=node;return node;}
function walk(node,path,fn,depth=0){fn(node,path,depth);if(node.t==='d'){const real=depth>0?(mountAt(path)||node):node;for(const k of Object.keys(real.kids).sort())walk(real.kids[k],(path==='/'?'':path)+'/'+k,fn,depth+1);}}
const nodeSize=n=>n.t==='d'?(n.size||4096):n.t==='l'?n.target.length:(n.size!=null?n.size:(n.gen?n.gen():(n.data||'')).length);

/* 권한 문자열 */
function modeStr(n){
  const t=n.t==='d'?'d':n.t==='l'?'l':n.dev==='b'?'b':n.dev==='c'?'c':'-';const m=n.mode;
  const r=(b,c)=>m&b?c:'-';
  let s=t+r(0o400,'r')+r(0o200,'w')+(m&0o4000?(m&0o100?'s':'S'):r(0o100,'x'))+r(0o40,'r')+r(0o20,'w')+(m&0o2000?(m&0o10?'s':'S'):r(0o10,'x'))+r(0o4,'r')+r(0o2,'w')+(m&0o1000?(m&0o1?'t':'T'):r(0o1,'x'));
  return s+'.';
}
const oct=m=>(m&0o7000?(m>>9).toString():'')+((m&0o777).toString(8).padStart(3,'0'));

/* ================= 사용자 ================= */
const homeOf=n=>{const u=S.users.find(x=>x.name===n);return u?u.home:'/';};
const curUser=()=>S.users.find(u=>u.name===S.user)||S.users[0];
const uname=uid=>S.users.find(u=>u.uid===uid)?.name??String(uid);
const gname=gid=>S.groups.find(g=>g.gid===gid)?.name??String(gid);
const userBy=n=>S.users.find(u=>u.name===n);
const groupBy=n=>/^\d+$/.test(n)?S.groups.find(g=>g.gid===+n):S.groups.find(g=>g.name===n);
const mkU=(name,uid,gid,gecos,home,shell,o={})=>Object.assign({name,uid,gid,gecos,home,shell,hash:'*',pw:null,lastchg:dayNo()-30,min:0,max:99999,warn:7,inact:'',expire:''},o);
function genPasswd(){return S.users.map(u=>`${u.name}:x:${u.uid}:${u.gid}:${u.gecos}:${u.home}:${u.shell}`).join('\n')+'\n';}
function genShadow(){return S.users.map(u=>`${u.name}:${u.hash}:${u.lastchg}:${u.min}:${u.max}:${u.warn}:${u.inact}:${u.expire===''?'':u.expire}:`).join('\n')+'\n';}

  if(VI){if(k==='C-c')viKey('Escape');else viKey(k);viRender();$('#vik')?.focus();return;}
  if(k==='C-c'){ctrlC();cmdEl.focus();return;}if(k==='Escape'){cmdEl.focus();return;}
  if(k.length===1){const p=cmdEl.selectionStart??cmdEl.value.length;cmdEl.value=cmdEl.value.slice(0,p)+k+cmdEl.value.slice(cmdEl.selectionEnd??p);cmdEl.focus();cmdEl.setSelectionRange(p+1,p+1);return;}
  if(k==='ArrowLeft'||k==='ArrowRight'){const p=(cmdEl.selectionStart??0)+(k==='ArrowLeft'?-1:1);cmdEl.focus();cmdEl.setSelectionRange(Math.max(0,p),Math.max(0,p));return;}
  cmdEl.focus();cmdEl.dispatchEvent(new KeyboardEvent('keydown',{key:k}));}},l)));
</script>
<script>
/* ================= 실습 과제 ================= */
const C=s=>`<code>${esc(s)}</code>`;
const ok=(c,why)=>c?true:why;
const nd=p=>lookup(p)?.node;
const md=p=>{const n=lookup(p,false)?.node;return n?n.mode&0o7777:null;};
const mstr=m=>m==null?'없음':oct(m).padStart(m>0o777?4:3,'0');
const NAMES=['kim','lee','park','choi','jung','kang','yoon','han','hong','song'];
const PROJ=['project','work','webapp','share','dev'];
const used=res=>S.log.some(l=>{const n=l.trim().replace(/\s+/g,' ').replace(/["']/g,'');return res.some(r=>r.test(n));});
const fileHas=(p,re)=>re.test(readFile(p)||'');
function addUserQ(name,o={}){const uid=o.uid||nextId(S.users,'uid',1001);if(!groupBy(name))S.groups.push({name,gid:uid,mem:[]});S.users.push(mkU(name,uid,groupBy(name).gid,'',o.home||'/home/'+name,o.shell||'/bin/bash',{hash:hashOf('Passw0rd!'),pw:'Passw0rd!',lastchg:dayNo()-10}));
  if(o.mkhome!==false){put((o.home||'/home/'+name)+'/.bashrc',F('# .bashrc\n',0o644,uid,uid));Object.assign(lookup(o.home||'/home/'+name).node,{mode:0o700,uid,gid:uid});}return userBy(name);}
function mk(p,data='',mode=0o644,uid=0,gid=0){return put(p,F(data,mode,uid,gid));}
function mkd(p,mode=0o755,uid=0,gid=0){const parts=p.split('/').filter(Boolean);let cur='';parts.forEach((x,i)=>{cur+='/'+x;if(!exists(cur))put(cur,D(i===parts.length-1?mode:0o755,i===parts.length-1?uid:0,i===parts.length-1?gid:0));});return lookup(p).node;}
const ACT=s=>S.svc[s]&&S.svc[s].a;const ENA=s=>S.svc[s]&&S.svc[s].e;
const fwHas=(kind,v)=>S.fw.pm[kind].includes(v)&&S.fw.rt[kind].includes(v);
const fwWhy=(kind,v)=>`영구 설정 ${S.fw.pm[kind].includes(v)?'있음':'없음'} / 현재(런타임) ${S.fw.rt[kind].includes(v)?'있음':'없음'}`;
const SCHED=[
  {t:'매일 23시 정각',f:['0','23','*','*','*']},{t:'매주 일요일 새벽 2시 30분',f:['30','2','*','*','0']},{t:'매월 1일 오전 6시',f:['0','6','1','*','*']},
  {t:'평일(월~금) 9시부터 18시까지 매시 정각',f:['0','9-18','*','*','1-5']},{t:'10분마다',f:['*/10','*','*','*','*']},{t:'매주 월요일과 목요일 오전 4시 15분',f:['15','4','*','*','1,4']},{t:'매년 1월 1일 0시 0분',f:['0','0','1','1','*']},{t:'매일 오전 7시 30분',f:['30','7','*','*','*']}];
const setsEq=(a,b)=>a.size===b.size&&[...a].every(x=>b.has(x));

const TASKS=[
{id:'free',cat:'자유 연습',t:'자유 연습',lead:'채점 없이 명령어를 마음대로 쳐 봅니다. help로 명령 목록, man 명령으로 설명을 봅니다.',gen:()=>({}),items:()=>[],hint:()=>['과제 목록에서 연습할 과제를 고르면 문제와 채점이 나옵니다.','[처음부터]를 누르면 서버가 처음 상태로 돌아갑니다.','reboot을 하면 영구 설정(ifcfg, fstab, systemctl enable, firewall --permanent)만 남는지 확인할 수 있습니다.']},

{id:'files',cat:'파일 관리',t:'파일과 디렉터리 다루기',
 gen:()=>({p:pick(PROJ),y:pick(['2025','2026']),msg:pick(['hello linux','network admin','backup ok'])}),
 setup:(st,p)=>{mk('/root/notes.txt','meeting at 10\n');mkd('/tmp/old_logs');mk('/tmp/old_logs/a.log','x\n');mk('/tmp/old_logs/b.log','y\n');mkd('/tmp/old_logs/2024');},
 leadF:p=>'다음 작업을 하십시오. 상위 디렉터리가 없으면 함께 만듭니다.',
 items:p=>{const b='/data/'+p.p;return [
  {t:`디렉터리 ${C(b+'/docs/'+p.y)} 만들기`,f:()=>ok(isDir(b+'/docs/'+p.y),'디렉터리가 없습니다. mkdir -p 를 써 보세요.')},
  {t:`${C('/etc/hosts')}를 ${C(b+'/docs/hosts.bak')}로 복사`,f:()=>ok(readFile(b+'/docs/hosts.bak')===readFile('/etc/hosts'),exists(b+'/docs/hosts.bak')?'내용이 /etc/hosts와 다릅니다.':'파일이 없습니다.')},
  {t:`${C(b+'/readme.txt')} 파일에 ${C(p.msg)} 한 줄 저장`,f:()=>ok((readFile(b+'/readme.txt')||'').trim()===p.msg,exists(b+'/readme.txt')?'현재 내용: '+(readFile(b+'/readme.txt')||'').trim():'파일이 없습니다.')},
  {t:`${C('/root/notes.txt')}를 ${C(b+'/')}로 이동`,f:()=>ok(!exists('/root/notes.txt')&&exists(b+'/notes.txt'),exists('/root/notes.txt')?'/root/notes.txt가 아직 있습니다.':'이동한 파일이 없습니다.')},
  {t:`${C('/tmp/old_logs')} 디렉터리를 안의 파일까지 삭제`,f:()=>ok(!exists('/tmp/old_logs'),'아직 있습니다. rm -r (묻지 않으려면 -f) 를 쓰세요.')}];},
 hint:p=>[`mkdir -p /data/${p.p}/docs/${p.y}`,`cp /etc/hosts /data/${p.p}/docs/hosts.bak`,`echo "${p.msg}" > /data/${p.p}/readme.txt`,`mv /root/notes.txt /data/${p.p}/`,'rm -rf /tmp/old_logs (root는 rm에 -i 별칭이 있어 -f 없이 쓰면 하나씩 묻습니다)']},

{id:'chmod',cat:'파일 관리',t:'권한 바꾸기 (chmod)',
 gen:()=>{const a=pick([['754','rwxr-xr--'],['750','rwxr-x---'],['775','rwxrwxr-x'],['711','rwx--x--x']]);return {a,b:pick(['600','640','400']),sym:Math.random()<.5};},
 setup:()=>{mkd('/data');mk('/data/script.sh','#!/bin/bash\necho run\n');mk('/data/secret.txt','pw=1234\n');mkd('/data/public');mk('/data/tool','',0o755);mkd('/data/team');mk('/data/team/a.txt','');mkd('/data/team/sub');mk('/data/team/sub/b.txt','');},
 leadF:()=>'/data 아래 파일의 권한을 다음과 같이 바꾸십시오.',
 items:p=>[
  {t:`${C('/data/script.sh')} 권한 ${p.sym?C(p.a[1])+' (숫자로 바꿔 써도 됨)':C(p.a[0])}`,f:()=>ok(md('/data/script.sh')===parseInt(p.a[0],8),'현재 '+mstr(md('/data/script.sh')))},
  {t:`${C('/data/secret.txt')} 권한 ${C(p.b)}`,f:()=>ok(md('/data/secret.txt')===parseInt(p.b,8),'현재 '+mstr(md('/data/secret.txt')))},
  {t:`${C('/data/public')} 모든 사용자 읽기·쓰기·실행 + 스티키 비트 (${C('1777')})`,f:()=>ok(md('/data/public')===0o1777,'현재 '+mstr(md('/data/public')))},
  {t:`${C('/data/tool')}에 SetUID 설정 (${C('4755')})`,f:()=>ok(md('/data/tool')===0o4755,'현재 '+mstr(md('/data/tool')))},
  {t:`${C('/data/team')}과 그 안의 모든 파일·디렉터리에서 기타 사용자(o) 권한 모두 제거`,f:()=>{let bad=null;walk(nd('/data/team'),'/data/team',(n,path)=>{if(n.mode&0o7&&!bad)bad=path;});return ok(!bad,bad?bad+' 에 기타 사용자 권한이 남아 있습니다.':'');}}],
 hint:p=>[`chmod ${p.a[0]} /data/script.sh (r=4, w=2, x=1을 더함: ${p.a[1]} → ${p.a[0]})`,`chmod ${p.b} /data/secret.txt`,'chmod 1777 /data/public (또는 chmod o+t)','chmod 4755 /data/tool (또는 chmod u+s)','chmod -R o-rwx /data/team','ls -l 로 확인합니다. 스티키 비트는 t, SetUID는 s로 보입니다.']},

{id:'chown',cat:'파일 관리',t:'소유자와 그룹 (chown · chgrp)',
 gen:()=>({u:pick(NAMES),g:pick(['dev','sales','ops'])}),
 setup:(st,p)=>{addUserQ(p.u);S.groups.push({name:p.g,gid:2000,mem:[]});mkd('/data/team');mk('/data/team/plan.txt','');mkd('/data/team/src');mk('/data/team/src/main.c','');mk('/data/report.txt','');mk('/data/app.conf','');},
 leadF:p=>`사용자 ${C(p.u)}와 그룹 ${C(p.g)}가 있습니다.`,
 items:p=>[
  {t:`${C('/data/team')}과 그 안 전체의 소유자 ${C(p.u)}, 그룹 ${C(p.g)}`,f:()=>{let bad=null;const n=nd('/data/team');if(!n)return '디렉터리가 없습니다.';walk(n,'/data/team',(x,path)=>{if(!bad&&(uname(x.uid)!==p.u||gname(x.gid)!==p.g))bad=`${path}: ${uname(x.uid)}:${gname(x.gid)}`;});return ok(!bad,bad);}},
  {t:`${C('/data/report.txt')}의 그룹만 ${C(p.g)}로 (소유자는 root 유지)`,f:()=>{const n=nd('/data/report.txt');return ok(n&&gname(n.gid)===p.g&&n.uid===0,n?`현재 ${uname(n.uid)}:${gname(n.gid)}`:'');}},
  {t:`${C('/data/app.conf')}의 소유자만 ${C(p.u)}로 (그룹은 root 유지)`,f:()=>{const n=nd('/data/app.conf');return ok(n&&uname(n.uid)===p.u&&n.gid===0,n?`현재 ${uname(n.uid)}:${gname(n.gid)}`:'');}}],
 hint:p=>[`chown -R ${p.u}:${p.g} /data/team`,`chgrp ${p.g} /data/report.txt (또는 chown :${p.g} /data/report.txt)`,`chown ${p.u} /data/app.conf`,'ls -l, ls -lR 로 확인합니다.']},

{id:'umask',cat:'파일 관리',t:'umask와 기본 권한',
 gen:()=>pick([{um:'027',f:0o640,d:0o750},{um:'077',f:0o600,d:0o700},{um:'002',f:0o664,d:0o775},{um:'022',f:0o644,d:0o755,pre:'077'}]),
 setup:(st,p)=>{if(p.pre)S.umask=parseInt(p.pre,8);},
 leadF:p=>`현재 셸의 umask를 바꾼 뒤 새 파일과 디렉터리를 만드십시오.${p.pre?' (지금 umask는 '+p.pre+'입니다)':''}`,
 items:p=>[
  {t:`umask를 ${C(p.um)}로 설정`,f:()=>ok(S.umask===parseInt(p.um,8),'현재 '+S.umask.toString(8).padStart(4,'0'))},
  {t:`새 파일 ${C('/root/new.txt')} 만들기 → 권한이 ${C(mstr(p.f))}이어야 함`,f:()=>ok(md('/root/new.txt')===p.f,'현재 '+mstr(md('/root/new.txt'))+(exists('/root/new.txt')?' (umask를 바꾼 뒤에 만들어야 합니다)':''))},
  {t:`새 디렉터리 ${C('/root/newdir')} 만들기 → 권한이 ${C(mstr(p.d))}이어야 함`,f:()=>ok(md('/root/newdir')===p.d,'현재 '+mstr(md('/root/newdir')))}],
 hint:p=>[`umask ${p.um}`,`파일 기본값 666 − ${p.um} → ${mstr(p.f)}, 디렉터리 기본값 777 − ${p.um} → ${mstr(p.d)}`,'touch /root/new.txt; mkdir /root/newdir; ls -ld /root/new*','umask는 현재 셸에만 적용됩니다. 재부팅하거나 다시 로그인하면 원래대로 돌아갑니다.']},

{id:'link',cat:'파일 관리',t:'하드 링크와 심볼릭 링크',
 gen:()=>({v:pick(['2.1','3.0','1.8'])}),
 setup:(st,p)=>{mkd('/data/app/v'+p.v);mk('/data/app/v'+p.v+'/config.ini','port=8080\n');mkd('/data/app/v1.0');},
 leadF:p=>`${C('/data/app')} 아래에 버전별 디렉터리가 있습니다.`,
 items:p=>[
  {t:`심볼릭 링크 ${C('/data/app/current')} → ${C('/data/app/v'+p.v)}`,f:()=>{const n=lookup('/data/app/current',false)?.node;if(!n)return '링크가 없습니다.';if(n.t!=='l')return '심볼릭 링크가 아닙니다.';const r=lookup('/data/app/current');return ok(r&&r.node===nd('/data/app/v'+p.v),'가리키는 곳: '+n.target);}},
  {t:`하드 링크 ${C('/root/hosts.hard')} → ${C('/etc/hosts')} (같은 아이노드)`,f:()=>{const n=lookup('/root/hosts.hard',false)?.node;if(!n)return '파일이 없습니다.';if(n.t==='l')return '심볼릭 링크입니다. -s 없이 만드세요.';return ok(n===nd('/etc/hosts'),'/etc/hosts와 다른 파일입니다 (복사본).');}},
  {t:`심볼릭 링크 ${C('/root/cfg')} → ${C('/data/app/current/config.ini')}`,f:()=>{const n=lookup('/root/cfg',false)?.node;return ok(n&&n.t==='l'&&lookup('/root/cfg')?.node===nd('/data/app/v'+p.v+'/config.ini'),n?'가리키는 곳: '+(n.target||'(하드 링크)'):'링크가 없습니다.');}}],
 hint:p=>[`ln -s /data/app/v${p.v} /data/app/current`,'ln /etc/hosts /root/hosts.hard','ln -s /data/app/current/config.ini /root/cfg','ls -li 로 아이노드와 링크 수, -> 표시를 확인합니다.']},

{id:'useradd',cat:'사용자 관리',t:'그룹과 사용자 만들기',
 gen:()=>{const u=pick(NAMES)+rnd(1,9);return {u,uid:rnd(1500,1599),g:pick(['dev','sales','netadm']),gid:rnd(2001,2099),sh:pick(['/bin/bash','/bin/sh']),home:pick(['/home/'+u,'/data/home/'+u]),cm:pick(['홍길동','Network Admin','Web Developer']),pw:pick(['Linux@2026','Passw0rd!','Net#Admin9'])};},
 setup:(st,p)=>{if(p.home.startsWith('/data'))mkd('/data/home');},
 leadF:()=>'새 그룹과 사용자를 만드십시오.',
 items:p=>{const U=()=>userBy(p.u);const no='사용자가 없습니다.';return [
  {t:`그룹 ${C(p.g)}, GID ${C(p.gid)}`,f:()=>{const g=groupBy(p.g);return ok(g&&g.gid===p.gid,g?'현재 GID '+g.gid:'그룹이 없습니다.');}},
  {t:`사용자 ${C(p.u)}, UID ${C(p.uid)}, 기본 그룹 ${C(p.g)}`,f:()=>ok(U()&&U().uid===p.uid&&gname(U().gid)===p.g,U()?`현재 UID ${U().uid}, 기본 그룹 ${gname(U().gid)}`:no)},
  {t:`보조 그룹 ${C('wheel')}`,f:()=>ok(groupBy('wheel').mem.includes(p.u),'wheel 그룹 구성원이 아닙니다.')},
  {t:`홈 디렉터리 ${C(p.home)} (실제로 만들어져 있어야 함)`,f:()=>ok(U()&&U().home===p.home&&isDir(p.home),U()?`설정 ${U().home}, 디렉터리 ${isDir(p.home)?'있음':'없음'}`:no)},
  {t:`로그인 셸 ${C(p.sh)}, 설명(코멘트) ${C(p.cm)}`,f:()=>ok(U()&&U().shell===p.sh&&U().gecos===p.cm,U()?`현재 ${U().shell}, "${U().gecos}"`:no)},
  {t:`암호 ${C(p.pw)}`,f:()=>ok(U()&&U().pw===p.pw,U()?(U().hash==='!!'?'암호가 설정되지 않았습니다 (/etc/shadow에 !!).':'암호가 다릅니다.'):no)}];},
 hint:p=>[`groupadd -g ${p.gid} ${p.g}`,`useradd -u ${p.uid} -g ${p.g} -G wheel -d ${p.home} -s ${p.sh} -c "${p.cm}" ${p.u}`,`passwd ${p.u} (두 번 입력)  또는  echo '${p.pw}' | passwd --stdin ${p.u}`,`확인: id ${p.u}, grep ${p.u} /etc/passwd /etc/shadow /etc/group`]},

{id:'usermod',cat:'사용자 관리',t:'사용자 수정 · 잠금 · 삭제',
 gen:()=>{const [a,b,c]=shuffle(NAMES).slice(0,3);return {a,b,c,max:pick([60,90,180]),exp:pick(['2026-12-31','2027-03-31','2027-06-30'])};},
 setup:(st,p)=>{addUserQ(p.a);addUserQ(p.b);addUserQ(p.c);mk('/home/'+p.c+'/data.txt','x\n',0o644,userBy(p.c).uid,userBy(p.c).gid);S.groups.push({name:'dev',gid:2000,mem:[p.a]});},
 leadF:p=>`사용자 ${C(p.a)}, ${C(p.b)}, ${C(p.c)}가 있습니다. ${C(p.a)}는 이미 ${C('dev')} 그룹의 구성원입니다.`,
 items:p=>{const U=n=>userBy(n);return [
  {t:`${C(p.a)}를 ${C('wheel')} 그룹에 추가 (기존 ${C('dev')} 소속 유지)`,f:()=>{const g=n=>groupBy(n).mem.includes(p.a);return ok(g('wheel')&&g('dev'),`wheel ${g('wheel')?'O':'X'}, dev ${g('dev')?'O':'X'} (기존 그룹을 지키려면 -aG)`);}},
  {t:`${C(p.a)}의 로그인 셸을 ${C('/sbin/nologin')}으로`,f:()=>ok(U(p.a)?.shell==='/sbin/nologin','현재 '+U(p.a)?.shell)},
  {t:`${C(p.b)} 계정 암호 잠금`,f:()=>ok(U(p.b)?.hash.startsWith('!'),'/etc/shadow 암호 칸 앞에 !가 없습니다.')},
  {t:`${C(p.b)}의 최대 암호 사용 기간 ${C(p.max+'일')}, 계정 만료일 ${C(p.exp)}`,f:()=>{const u=U(p.b);const e=Math.floor(Date.parse(p.exp)/864e5);return ok(u&&u.max===p.max&&u.expire===e,u?`현재 최대 ${u.max}일, 만료 ${u.expire===''?'없음':new Date(u.expire*864e5).toISOString().slice(0,10)}`:'');}},
  {t:`${C(p.c)} 사용자를 홈 디렉터리까지 삭제`,f:()=>ok(!U(p.c)&&!exists('/home/'+p.c),U(p.c)?'사용자가 남아 있습니다.':'홈 디렉터리가 남아 있습니다 (userdel -r).')}];},
 hint:p=>[`usermod -aG wheel ${p.a}  (-a 없이 -G만 쓰면 dev에서 빠집니다)`,`usermod -s /sbin/nologin ${p.a}`,`passwd -l ${p.b}  또는  usermod -L ${p.b}`,`chage -M ${p.max} -E ${p.exp} ${p.b}  → chage -l ${p.b}로 확인`,`userdel -r ${p.c}`]},

{id:'group',cat:'사용자 관리',t:'그룹 관리',
 gen:()=>{const [a,b]=shuffle(NAMES).slice(0,2);return {a,b,g:pick(['project','webteam','dbadmin']),gid:rnd(3001,3099),ng:pick(['devops','infra','support'])};},
 setup:(st,p)=>{addUserQ(p.a);addUserQ(p.b);S.groups.push({name:'temp',gid:2500,mem:[]});S.groups.push({name:'oldteam',gid:2600,mem:[p.a]});},
 leadF:p=>`사용자 ${C(p.a)}, ${C(p.b)}와 그룹 ${C('temp')}, ${C('oldteam')}이 있습니다.`,
 items:p=>[
  {t:`그룹 ${C(p.g)} 만들기, GID ${C(p.gid)}`,f:()=>{const g=groupBy(p.g);return ok(g&&g.gid===p.gid,g?'현재 GID '+g.gid:'그룹이 없습니다.');}},
  {t:`${C(p.a)}, ${C(p.b)}를 ${C(p.g)}의 구성원으로`,f:()=>{const g=groupBy(p.g);return ok(g&&g.mem.includes(p.a)&&g.mem.includes(p.b),g?'구성원: '+(g.mem.join(',')||'없음'):'');}},
  {t:`그룹 ${C('oldteam')}의 이름을 ${C(p.ng)}로 바꾸기 (GID 2600 유지)`,f:()=>{const g=groupBy(p.ng);return ok(g&&g.gid===2600&&!groupBy('oldteam'),g?'GID '+g.gid:'그룹이 없습니다.');}},
  {t:`그룹 ${C('temp')} 삭제`,f:()=>ok(!groupBy('temp'),'아직 있습니다.')}],
 hint:p=>[`groupadd -g ${p.gid} ${p.g}`,`gpasswd -a ${p.a} ${p.g}; gpasswd -a ${p.b} ${p.g}  (또는 usermod -aG ${p.g} 사용자)`,`groupmod -n ${p.ng} oldteam`,'groupdel temp','확인: grep -E "'+p.g+'|'+p.ng+'" /etc/group']},

{id:'ifcfg',cat:'네트워크',t:'고정 IP 설정 (ifcfg · nmcli)',
 gen:()=>{const p=pick([24,24,25,26]);const b=pick(['192.168.','10.0.','172.16.'])+rnd(1,200);const size=2**(32-p);const blk=rnd(0,256/size-1)*size;const ip=`${b}.${blk+rnd(2,size-3)}`;return {ip,p,mask:pfx2mask(p),gw:`${b}.${blk+1}`,dns:pick([['168.126.63.1','168.126.63.2'],['8.8.8.8','8.8.4.4'],['164.124.101.2','203.248.252.2']]),useMask:Math.random()<.4};},
 leadF:()=>`ens33이 DHCP로 주소를 받고 있습니다. 재부팅해도 유지되도록 고정 IP로 바꾸고 바로 적용하십시오.`,
 items:p=>{const t=()=>readFile(IFCFG)||'';return [
  {t:`${C(IFCFG)}: ${C('BOOTPROTO=static')} (또는 none)`,f:()=>ok(/^(static|none)$/i.test(kvGet(t(),'BOOTPROTO')||''),'현재 BOOTPROTO='+kvGet(t(),'BOOTPROTO'))},
  {t:`${C('IPADDR='+p.ip)}, ${p.useMask?C('NETMASK='+p.mask):C('PREFIX='+p.p)} (둘 중 어느 형식이든 가능)`,f:()=>{const pre=kvGet(t(),'PREFIX')?+kvGet(t(),'PREFIX'):mask2pfx(kvGet(t(),'NETMASK')||'');return ok(kvGet(t(),'IPADDR')===p.ip&&pre===p.p,`현재 IPADDR=${kvGet(t(),'IPADDR')}, PREFIX=${kvGet(t(),'PREFIX')}, NETMASK=${kvGet(t(),'NETMASK')}`);}},
  {t:`${C('GATEWAY='+p.gw)}, ${C('DNS1='+p.dns[0])}, ${C('DNS2='+p.dns[1])}`,f:()=>ok(kvGet(t(),'GATEWAY')===p.gw&&kvGet(t(),'DNS1')===p.dns[0]&&kvGet(t(),'DNS2')===p.dns[1],`현재 GATEWAY=${kvGet(t(),'GATEWAY')}, DNS1=${kvGet(t(),'DNS1')}, DNS2=${kvGet(t(),'DNS2')}`)},
  {t:`${C('ONBOOT=yes')}`,f:()=>ok((kvGet(t(),'ONBOOT')||'').toLowerCase()==='yes','현재 ONBOOT='+kvGet(t(),'ONBOOT'))},
  {t:`지금 적용됨: ${C('ip addr')}에 ${C(p.ip+'/'+p.p)}, 기본 게이트웨이 ${C(p.gw)}`,f:()=>{const n=S.net.ens33;return ok(n.up&&!n.dhcp&&n.ip===p.ip&&n.prefix===p.p&&S.net.gw===p.gw,`현재 ${n.up?n.ip+'/'+n.prefix:'down'}${n.dhcp?' (dhcp)':''}, gw ${S.net.gw||'없음'}`);}},
  {t:`${C('/etc/resolv.conf')}에 nameserver ${C(p.dns[0])}, ${C(p.dns[1])}`,f:()=>{const ns=nameservers();return ok(ns[0]===p.dns[0]&&ns[1]===p.dns[1],'현재 '+(ns.join(', ')||'없음'));}}];},
 hint:p=>[`vi ${IFCFG}`,`BOOTPROTO=dhcp → BOOTPROTO=static 로 고치고 아래 줄 추가: IPADDR=${p.ip} ${p.useMask?'NETMASK='+p.mask:'PREFIX='+p.p} GATEWAY=${p.gw} DNS1=${p.dns[0]} DNS2=${p.dns[1]} (ONBOOT=yes 확인)`,'systemctl restart network  (또는 nmcli con reload; nmcli con up ens33)',`nmcli로 한 번에: nmcli con mod ens33 ipv4.method manual ipv4.addresses ${p.ip}/${p.p} ipv4.gateway ${p.gw} ipv4.dns "${p.dns.join(' ')}" connection.autoconnect yes → nmcli con up ens33`,'확인: ip addr, ip route, cat /etc/resolv.conf, ping -c 2 '+p.gw]},

{id:'hostdns',cat:'네트워크',t:'호스트 이름 · hosts · DNS 클라이언트',
 gen:()=>({hn:pick(['web01','srv-ns','linux-lab','node2'])+'.'+pick(['example.com','netlab.local']),hip:'192.168.10.'+rnd(20,90),hname:pick(['fileserver','dbserver','backup']),dns:pick([['168.126.63.1','8.8.8.8'],['8.8.8.8','1.1.1.1']])}),
 leadF:()=>'호스트 이름과 이름 해석 설정을 바꾸십시오.',
 items:p=>[
  {t:`호스트 이름을 ${C(p.hn)}로 (재부팅 후에도 유지)`,f:()=>ok(S.hostFile===p.hn&&S.host===p.hn,`현재 ${S.host}, /etc/hostname ${S.hostFile}`+(S.host===p.hn&&S.hostFile!==p.hn?' (hostname 명령은 임시로만 바뀝니다)':''))},
  {t:`${C('/etc/hosts')}에 ${C(p.hip+'  '+p.hname)} 등록 → ${C('ping '+p.hname)}가 이 주소로 풀려야 함`,f:()=>ok(resolve(p.hname)===p.hip,'현재 '+(resolve(p.hname)||'이름이 풀리지 않음'))},
  {t:`DNS 서버: ${C('/etc/resolv.conf')}의 nameserver 1순위 ${C(p.dns[0])}, 2순위 ${C(p.dns[1])}`,f:()=>{const ns=nameservers();return ok(ns[0]===p.dns[0]&&ns[1]===p.dns[1],'현재 '+(ns.join(', ')||'없음'));}}],
 hint:p=>[`hostnamectl set-hostname ${p.hn}  (확인: hostnamectl, cat /etc/hostname)`,`echo "${p.hip}  ${p.hname}" >> /etc/hosts  또는 vi /etc/hosts`,`vi /etc/resolv.conf → nameserver ${p.dns[0]} / nameserver ${p.dns[1]}`,'참고: 실제로는 NetworkManager가 resolv.conf를 덮어쓰므로 영구 설정은 ifcfg의 DNS1/DNS2 또는 nmcli ipv4.dns 로 합니다.']},

{id:'svc',cat:'서비스',t:'서비스 관리와 방화벽',
 gen:()=>({port:pick(['8080/tcp','3306/tcp','5000/tcp','161/udp'])}),
 setup:()=>{installPkg('vsftpd');S.svc.vsftpd={a:true,e:true,pid:1410};},
 leadF:()=>'systemctl과 firewall-cmd로 다음과 같이 설정하십시오. 방화벽 설정은 지금 바로, 그리고 재부팅 후에도 적용되어야 합니다.',
 items:p=>[
  {t:`${C('httpd')} 서비스 시작`,f:()=>ok(ACT('httpd'),'httpd가 실행 중이 아닙니다.')},
  {t:`${C('httpd')} 부팅 시 자동 시작`,f:()=>ok(ENA('httpd'),'disabled 상태입니다.')},
  {t:`${C('vsftpd')} 중지, 부팅 시 자동 시작 해제`,f:()=>ok(!ACT('vsftpd')&&!ENA('vsftpd'),`현재 ${ACT('vsftpd')?'active':'inactive'} / ${ENA('vsftpd')?'enabled':'disabled'}`)},
  {t:`방화벽에 ${C('http')} 서비스 허용 (영구 + 현재)`,f:()=>ok(fwHas('services','http'),fwWhy('services','http'))},
  {t:`방화벽에 포트 ${C(p.port)} 허용 (영구 + 현재)`,f:()=>ok(fwHas('ports',p.port),fwWhy('ports',p.port))}],
 hint:p=>['systemctl start httpd; systemctl enable httpd  (한 번에: systemctl enable --now httpd)','systemctl stop vsftpd; systemctl disable vsftpd',`firewall-cmd --permanent --add-service=http; firewall-cmd --permanent --add-port=${p.port}`,'firewall-cmd --reload  (--permanent는 파일에만 쓰므로 reload해야 지금 적용됩니다)','확인: systemctl status httpd, systemctl is-enabled vsftpd, firewall-cmd --list-all']},

{id:'sshd',cat:'서비스',t:'SSH 서버 설정',
 gen:()=>({port:pick([2222,2022,10022])}),
 leadF:()=>'보안을 위해 SSH 서버 설정을 바꾸십시오.',
 items:p=>[
  {t:`${C('/etc/ssh/sshd_config')}: ${C('Port '+p.port)}`,f:()=>ok(confVal('/etc/ssh/sshd_config','Port')===String(p.port),'현재 '+(confVal('/etc/ssh/sshd_config','Port')||'#Port 22 (주석, 기본값 22)'))},
  {t:`${C('PermitRootLogin no')}`,f:()=>ok(confVal('/etc/ssh/sshd_config','PermitRootLogin')==='no','현재 '+(confVal('/etc/ssh/sshd_config','PermitRootLogin')||'#PermitRootLogin yes (주석, 기본값 yes)'))},
  {t:`sshd를 다시 시작해 새 포트 ${C(p.port)}에서 대기`,f:()=>ok(ACT('sshd')&&(S.svc.sshd.ports||[]).some(x=>x[1]===p.port),ACT('sshd')?'아직 이전 설정으로 실행 중입니다 (restart 필요).':'sshd가 실행 중이 아닙니다.')},
  {t:`방화벽에 ${C(p.port+'/tcp')} 허용 (영구 + 현재)`,f:()=>ok(fwHas('ports',p.port+'/tcp'),fwWhy('ports',p.port+'/tcp'))}],
 hint:p=>['vi /etc/ssh/sshd_config',`#Port 22 → Port ${p.port} (맨 앞 #을 지워야 적용), #PermitRootLogin yes → PermitRootLogin no`,'systemctl restart sshd',`firewall-cmd --permanent --add-port=${p.port}/tcp; firewall-cmd --reload`,`확인: netstat -tnlp | grep sshd, ssh -p ${p.port} root@localhost (root 거부되어야 함)`,'실제 CentOS에서는 SELinux 때문에 semanage port -a -t ssh_port_t -p tcp '+p.port+' 도 필요합니다.']},

{id:'httpd',cat:'서비스',t:'웹 서버(httpd) 설정',
 gen:()=>({port:pick([80,8080,8000]),root:pick(['/data/www','/web/html','/srv/www']),msg:pick(['Welcome to Linux Web','Network Admin Test','Hello httpd'])}),
 leadF:p=>'Apache 웹 서버를 다음과 같이 설정하고 서비스하십시오.',
 items:p=>{const conf='/etc/httpd/conf/httpd.conf';const v=()=>S.svc.httpd||{};return [
  {t:`${C(conf)}: ${C('Listen '+p.port)}`,f:()=>ok(svcPorts('httpd').some(x=>x[1]===p.port),'현재 Listen '+svcPorts('httpd').map(x=>x[1]).join(', '))},
  {t:`${C('DocumentRoot "'+p.root+'"')}`,f:()=>ok((confVal(conf,'DocumentRoot')||'').replace(/"/g,'')===p.root,'현재 '+confVal(conf,'DocumentRoot'))},
  {t:`${C(p.root+'/index.html')}에 ${C(p.msg)} 저장`,f:()=>ok((readFile(p.root+'/index.html')||'').trim()===p.msg,exists(p.root+'/index.html')?'현재 내용: '+(readFile(p.root+'/index.html')||'').trim():'파일이 없습니다.')},
  {t:`httpd 시작(설정 반영) + 부팅 시 자동 시작`,f:()=>ok(ACT('httpd')&&ENA('httpd')&&(v().ports||[]).some(x=>x[1]===p.port)&&v().docroot===p.root,!ACT('httpd')?'실행 중이 아닙니다.':!ENA('httpd')?'enable 하지 않았습니다.':'설정을 바꾼 뒤 restart 하지 않았습니다.')},
  ...(p.port!==80?[{t:`방화벽에 ${C(p.port+'/tcp')} 허용 (영구 + 현재)`,f:()=>ok(fwHas('ports',p.port+'/tcp'),fwWhy('ports',p.port+'/tcp'))}]:[{t:`방화벽에 ${C('http')} 서비스 허용 (영구 + 현재)`,f:()=>ok(fwHas('services','http'),fwWhy('services','http'))}])];},
 hint:p=>[`vi /etc/httpd/conf/httpd.conf → Listen ${p.port}, DocumentRoot "${p.root}" (아래 <Directory "/var/www/html">도 같은 경로로 바꾸면 좋습니다)`,`mkdir -p ${p.root}; echo "${p.msg}" > ${p.root}/index.html`,'systemctl restart httpd; systemctl enable httpd',p.port!==80?`firewall-cmd --permanent --add-port=${p.port}/tcp; firewall-cmd --reload`:'firewall-cmd --permanent --add-service=http; firewall-cmd --reload',`확인: curl http://localhost${p.port===80?'':':'+p.port}/`]},

{id:'pkg',cat:'패키지',t:'패키지 설치와 삭제 (yum · rpm)',
 gen:()=>({inst:pick(['vsftpd','samba','bind','mariadb-server']),rm:'telnet'}),
 leadF:()=>'패키지를 관리하십시오. 서버는 인터넷 저장소에 연결되어 있습니다.',
 items:p=>{const svc=PKGS[p.inst].svc;return [
  {t:`${C(p.inst)} 패키지 설치`,f:()=>ok(S.pkgs.includes(p.inst),'설치되지 않았습니다.')},
  {t:`${C(svc)} 서비스 시작 + 부팅 시 자동 시작`,f:()=>ok(ACT(svc)&&ENA(svc),S.svc[svc]?`현재 ${ACT(svc)?'active':'inactive'} / ${ENA(svc)?'enabled':'disabled'}`:'서비스가 없습니다 (패키지 먼저 설치).')},
  {t:`${C(p.rm)} 패키지 삭제`,f:()=>ok(!S.pkgs.includes(p.rm),'아직 설치되어 있습니다.')}];},
 hint:p=>[`yum install -y ${p.inst}  (-y가 없으면 Is this ok [y/d/N]: 에 y)`,`systemctl enable --now ${PKGS[p.inst].svc}`,`rpm -e ${p.rm}  또는  yum remove -y ${p.rm}`,`확인: rpm -qa | grep ${p.inst}, rpm -q ${p.rm}`]},

{id:'proc',cat:'프로세스',t:'프로세스 찾기와 종료',
 gen:()=>({u:pick(NAMES),ni:pick([5,10,15])}),
 setup:(st,p)=>{addUserQ(p.u);const b=S.nextPid+=200;S.extraProcs.push({pid:b,user:p.u,cmd:'/usr/bin/stress --cpu 4',cpu:98.7,ignoreTerm:true},{pid:b+17,user:p.u,cmd:'yes',cpu:45.1},{pid:b+29,user:'root',cmd:'/root/backup.sh',cpu:2.0});},
 leadF:p=>`CPU를 많이 쓰는 프로세스가 있습니다. ${C('ps')}나 ${C('top')}으로 찾아 처리하십시오.`,
 items:p=>{const has=c=>S.extraProcs.some(x=>x.cmd.includes(c));return [
  {t:`${C('stress')} 프로세스 강제 종료 (일반 종료 신호는 무시함)`,f:()=>ok(!has('stress'),'아직 실행 중입니다. kill -9 로 보내세요.')},
  {t:`${C('yes')} 프로세스 종료`,f:()=>ok(!has('yes'),'아직 실행 중입니다.')},
  {t:`${C('/root/backup.sh')}는 끄지 말고 nice 값을 ${C(p.ni)}로`,f:()=>{const x=S.extraProcs.find(y=>y.cmd.includes('backup.sh'));return ok(x&&x.ni===p.ni,x?'현재 nice '+(x.ni||0):'backup.sh가 종료되었습니다. [처음부터]로 다시 시작하세요.');}}];},
 hint:p=>['ps aux --sort 대신 ps aux 또는 top 으로 PID 확인 (ps -ef | grep stress)','kill PID 로 안 죽으면 kill -9 PID (SIGKILL)','killall yes  또는  pkill yes  또는  kill PID',`renice -n ${p.ni} -p (backup.sh의 PID)`]},

{id:'tar',cat:'압축 · 백업',t:'tar 묶기·풀기와 gzip',
 gen:()=>({d:new Date().toISOString().slice(0,10).replace(/-/g,'')}),
 setup:()=>{mkd('/data/web');mk('/data/web/index.html','<h1>web</h1>\n');mkd('/data/web/img');mk('/data/web/img/logo.png','');mkd('/backup');
   const items=[{name:'etc/hosts',node:copyNode(nd('/etc/hosts'))},{name:'etc/fstab',node:copyNode(nd('/etc/fstab'))}];mk('/root/conf.tar','');Object.assign(nd('/root/conf.tar'),{arch:{items,z:false,j:false},size:20480});
   mk('/var/log/old.log','old log line\n'.repeat(50));},
 leadF:()=>'백업 작업을 하십시오.',
 items:p=>{const an=`/backup/web-${p.d}.tar.gz`;return [
  {t:`${C('/data/web')} 디렉터리를 gzip으로 압축한 ${C(an)}로 묶기`,f:()=>{const n=nd(an);if(!n)return '파일이 없습니다.';if(!n.arch)return 'tar 아카이브가 아닙니다.';if(!n.arch.z)return 'gzip 압축(z 옵션)이 아닙니다.';const names=n.arch.items.map(i=>i.name);return ok(names.some(x=>/(^|\/)web$/.test(x)),'들어 있는 항목: '+names.join(', '));}},
  {t:`${C('/root/conf.tar')}를 ${C('/tmp/restore')} 아래에 풀기`,f:()=>ok(exists('/tmp/restore/etc/hosts')&&exists('/tmp/restore/etc/fstab'),'/tmp/restore/etc/hosts가 없습니다. 디렉터리를 먼저 만들고 -C로 지정하세요.')},
  {t:`${C('/var/log/old.log')}를 gzip으로 압축 (${C('old.log.gz')}만 남음)`,f:()=>ok(exists('/var/log/old.log.gz')&&!exists('/var/log/old.log'),exists('/var/log/old.log')?'원본이 남아 있습니다.':'old.log.gz가 없습니다.')}];},
 hint:p=>[`tar -czvf /backup/web-${p.d}.tar.gz /data/web  (c 만들기, z gzip, v 과정, f 파일 이름)`,'mkdir -p /tmp/restore; tar -xvf /root/conf.tar -C /tmp/restore  (내용 보기: tar -tvf)','gzip /var/log/old.log  (풀기: gunzip old.log.gz)']},

{id:'disk',cat:'디스크',t:'파일 시스템 만들기와 마운트',
 gen:()=>({fs:pick(['ext4','xfs']),dir:pick(['/mnt/data','/data2','/backup_disk']),uuid:Math.random()<.4}),
 leadF:p=>`두 번째 디스크 ${C('/dev/sdb')}에 파티션 ${C('/dev/sdb1')}이 만들어져 있습니다 (${C('fdisk -l')}로 확인).`,
 items:p=>{const d=()=>S.disks['/dev/sdb1'];return [
  {t:`${C('/dev/sdb1')}에 ${C(p.fs)} 파일 시스템 만들기`,f:()=>ok(d().fs===p.fs,'현재 '+(d().fs||'파일 시스템 없음'))},
  {t:`마운트 포인트 ${C(p.dir)} 만들고 지금 마운트`,f:()=>ok(S.mounts.some(m=>m.dev==='/dev/sdb1'&&m.dir===p.dir),S.mounts.length?'현재 마운트: '+S.mounts.map(m=>m.dev+' → '+m.dir).join(', '):'마운트되지 않았습니다.')},
  {t:`${C('/etc/fstab')}에 등록해 부팅할 때 자동 마운트${p.uuid?' (장치는 '+C('UUID=')+'로 지정)':''}`,f:()=>{const e=fstabEntries().find(x=>normPath(x[1])===p.dir);if(!e)return p.dir+' 줄이 없습니다.';if(devOf(e[0])!=='/dev/sdb1')return '장치가 /dev/sdb1을 가리키지 않습니다: '+e[0];if(p.uuid&&!e[0].startsWith('UUID='))return 'UUID= 형식이 아닙니다 (blkid로 UUID 확인).';if(e[2]!==p.fs&&e[2]!=='auto')return '파일 시스템 형식이 다릅니다: '+e[2];return true;}}];},
 hint:p=>['fdisk -l /dev/sdb 로 파티션 확인',`mkfs.${p.fs} /dev/sdb1  (또는 mkfs -t ${p.fs} /dev/sdb1)`,`mkdir -p ${p.dir}; mount /dev/sdb1 ${p.dir}; df -h`,`vi /etc/fstab 맨 아래: ${p.uuid?'UUID=(blkid로 본 값)':'/dev/sdb1'}  ${p.dir}  ${p.fs}  defaults  0 0`,'umount 후 mount -a 로 fstab이 맞는지 시험하거나 reboot 후 df -h로 확인합니다.']},

{id:'cron',cat:'예약 작업',t:'cron 예약 작업',
 gen:()=>{const [a,b]=shuffle(SCHED).slice(0,2);return {a,b,sa:pick(['/root/backup.sh','/root/cleanup.sh']),sb:pick(['/usr/local/bin/check.sh','/root/report.sh'])};},
 setup:(st,p)=>{mk(p.sa,'#!/bin/bash\n',0o755);put(p.sb,F('#!/bin/bash\n',0o755));},
 leadF:()=>`root 사용자의 crontab에 다음 작업을 등록하십시오.`,
 items:p=>{const job=(s,cmd)=>{const t=readFile('/var/spool/cron/root')||'';const pr=parseCron(t);const want=s.f.map(cronField);const j=pr.jobs.find(x=>x.cmd&&x.cmd.split(/\s+/)[0]===cmd);if(!j)return 'crontab에 '+cmd+' 줄이 없습니다.';if(j.reboot)return '@reboot는 맞지 않습니다.';return ok(j.sets.every((x,i)=>setsEq(x,want[i])),'현재: '+j.fields.join(' ')+' (기대: '+s.f.join(' ')+')');};return [
  {t:`${p.a.t}에 ${C(p.sa)} 실행`,f:()=>job(p.a,p.sa)},
  {t:`${p.b.t}에 ${C(p.sb)} 실행`,f:()=>job(p.b,p.sb)}];},
 hint:p=>['crontab -e 로 vi가 열리면 i로 입력, Esc 후 :wq','형식: 분(0-59) 시(0-23) 일(1-31) 월(1-12) 요일(0-7, 0과 7은 일요일) 명령',`${p.a.f.join(' ')} ${p.sa}`,`${p.b.f.join(' ')} ${p.sb}`,'확인: crontab -l, cat /var/spool/cron/root']},

{id:'cmdinfo',cat:'명령어',t:'시스템 정보 확인 명령어',
 gen:()=>({q:shuffle([
   ['커널 버전만 보기',[/^uname -r$/,/^uname -a$/]],['모든 프로세스를 자세히 보기',[/^ps (-ef|aux|-aux|-eF|-elf)$/]],['디스크(파일 시스템) 사용량을 G/M 단위로 보기',[/^df -h/,/^df -Th$/,/^df -hT$/]],['메모리 사용량을 MB 단위로 보기',[/^free -m$/]],
   ['TCP 대기 포트를 숫자와 프로세스 이름으로 보기',[/^netstat -(tnlp|tlnp|ntlp|lntp|tulnp|antp|nltp|plnt)$/,/^ss -(tnlp|tlnp|ntlp|lntp|tulnp)$/]],['CentOS 버전 보기',[/^cat \/etc\/(redhat|centos|os)-release$/,/^hostnamectl$/]],['httpd 패키지가 설치되어 있는지 rpm으로 확인',[/^rpm -q httpd$/,/^rpm -qa \| grep httpd$/,/^rpm -qa httpd$/]],
   ['최근 로그인 기록 보기',[/^last( |$)/]],['/var/log 디렉터리의 전체 크기 합계를 보기',[/^du -(sh|hs) \/var\/log\/?$/]],['라우팅 테이블을 숫자로 보기',[/^route -n$/,/^netstat -(rn|nr)$/,/^ip r(oute)?( show)?$/]],['현재 로그인한 사용자와 하는 일 보기',[/^w$/,/^who$/]],['시스템이 켜진 지 얼마나 되었는지 보기',[/^uptime$/]]]).slice(0,5)}),
 leadF:()=>'다음 정보를 확인하는 명령을 실행하십시오.',
 items:p=>p.q.map(([t,re])=>({t,f:()=>ok(used(re),'아직 실행하지 않았습니다.')})),
 hint:()=>['uname -r / ps -ef 또는 ps aux / df -h / free -m / netstat -tnlp 또는 ss -tnlp','cat /etc/redhat-release / rpm -q httpd / last / du -sh /var/log / route -n / w / uptime','명령 설명은 man 명령 으로 볼 수 있습니다.']},

{id:'cmdfind',cat:'명령어',t:'찾기와 필터 명령어',
 gen:()=>({u:pick(NAMES),q:null}),
 setup:(st,p)=>{addUserQ(p.u);mk('/home/'+p.u+'/todo.txt','',0o644,userBy(p.u).uid,userBy(p.u).gid);mk('/tmp/'+p.u+'_tmp','',0o644,userBy(p.u).uid,userBy(p.u).gid);mk('/var/tmp/big.iso','',0o644);nd('/var/tmp/big.iso').size=734003200;},
 leadF:()=>'다음 내용을 찾는 명령을 실행하십시오.',
 items:p=>[
  {t:`${C('/etc')} 아래에서 이름이 ${C('.conf')}로 끝나는 파일 찾기`,f:()=>ok(used([/^find \/etc\/? .*-name \*\.conf/]),'아직 실행하지 않았습니다.')},
  {t:'시스템 전체에서 SetUID가 설정된 파일 찾기',f:()=>ok(used([/^find \/ .*-perm (-4000|\/4000|-u\+s|\/u\+s|\+4000)/]),'아직 실행하지 않았습니다.')},
  {t:`사용자 ${C(p.u)}가 소유한 파일을 시스템 전체에서 찾기`,f:()=>ok(used([new RegExp('^find / .*-user '+p.u)]),'아직 실행하지 않았습니다.')},
  {t:`크기가 ${C('100MB')}보다 큰 파일 찾기`,f:()=>ok(used([/^find \/\S* .*-size \+(100M|102400k)/]),'아직 실행하지 않았습니다.')},
  {t:`${C('/var/log/secure')}에서 ${C('Failed')}가 들어간 줄만 보기`,f:()=>ok(used([/^grep (-\w+ )?Failed \/var\/log\/secure$/,/^cat \/var\/log\/secure \| grep (-\w+ )?Failed$/]),'아직 실행하지 않았습니다.')},
  {t:`${C('/etc/passwd')}에서 사용자 이름(첫 번째 필드)만 뽑기`,f:()=>ok(used([/^cut -d ?: -f ?1 \/etc\/passwd$/,/^awk -F ?: \{print \$1\} \/etc\/passwd$/,/^cat \/etc\/passwd \| (cut -d ?: -f ?1|awk -F ?: \{print \$1\})$/]),'아직 실행하지 않았습니다.')},
  {t:`${C('/etc/passwd')}의 줄 수(계정 수) 세기`,f:()=>ok(used([/^wc -l \/etc\/passwd$/,/^cat \/etc\/passwd \| wc -l$/]),'아직 실행하지 않았습니다.')}],
 hint:p=>['find /etc -name "*.conf"','find / -perm -4000  (2>/dev/null 를 붙이면 오류를 숨깁니다)',`find / -user ${p.u}`,'find / -size +100M','grep Failed /var/log/secure','cut -d: -f1 /etc/passwd  또는  awk -F: \'{print $1}\' /etc/passwd','wc -l /etc/passwd']},

{id:'vi',cat:'편집기',t:'vi 편집기 다루기',
 gen:()=>({old:pick(['oldserver','test-host','192.168.0.1']),neu:pick(['newserver','prod-host','10.0.0.1']),end:pick(['# END','# done','# EOF'])}),
 setup:(st,p)=>{mk('/root/memo.txt',`server list\nprimary=${p.old}\nTEMP LINE - delete me\nbackup=${p.old}\nmonitor=${p.old}\n`);},
 leadF:p=>`${C('/root/memo.txt')}를 vi로 열어 고치십시오. ${C(':set nu')}로 줄 번호를 켜면 편합니다.`,
 items:p=>{const L=()=>(readFile('/root/memo.txt')||'').split('\n').filter((x,i,a)=>i<a.length-1||x!=='');return [
  {t:`3번째 줄 ${C('TEMP LINE - delete me')} 삭제`,f:()=>ok(!L().some(l=>l.includes('TEMP LINE')),'아직 있습니다 (그 줄로 가서 dd).')},
  {t:`파일 안의 ${C(p.old)}를 모두 ${C(p.neu)}로 바꾸기`,f:()=>{const t=readFile('/root/memo.txt')||'';return ok(!t.includes(p.old)&&(t.match(new RegExp(p.neu.replace(/\./g,'\\.'),'g'))||[]).length===3,`${p.old} ${(t.split(p.old).length-1)}개 남음`);}},
  {t:`맨 아래에 ${C(p.end)} 줄 추가`,f:()=>ok(L()[L().length-1]===p.end,'마지막 줄: '+L()[L().length-1])},
  {t:'첫 줄 server list는 그대로',f:()=>ok(L()[0]==='server list','첫 줄: '+L()[0])}];},
 hint:p=>['vi /root/memo.txt',':set nu → :3 (3번째 줄로) → dd',`:%s/${p.old.replace(/\./g,'\\.')}/${p.neu}/g`,`G (마지막 줄로) → o (아래에 새 줄) → ${p.end} 입력 → Esc`,':wq (저장하지 않고 나가려면 :q!)']},
];

/* ================= 과제 패널 ================= */
let CUR=null,P=null,RES=null,SHOWH=false;
const done=LS.get('done',{});
function startTask(id,keepP){
  CUR=TASKS.find(t=>t.id===id)||TASKS[1];if(!keepP)P=CUR.gen();
  baseState();CUR.setup&&CUR.setup(S,P);
  Object.entries(S.svc).forEach(([s,v])=>{if(v.a&&!v.ports)v.ports=svcPorts(s);if(s==='httpd')v.docroot=(confVal('/etc/httpd/conf/httpd.conf','DocumentRoot')||'').replace(/"/g,'');});
  S.log=[];RES=null;SHOWH=false;
  if(VI){VI=null;$('#vi')?.remove();}ASK=null;
  clearScreen();print([`Last login: ${ctime(Date.now()-3600e3)} from 192.168.10.1`,{h:`<span class="c-dim">${esc('# 과제: '+CUR.t+'  ·  help 명령 목록 · man 명령 설명 · Tab 자동 완성')}</span>`,t:''}]);
  refreshPrompt();renderPanel();LS.set('cur',CUR.id);
}
function grade(){RES=CUR.items(P).map(it=>{let r;try{r=it.f();}catch(e){r='확인할 수 없습니다.';console.error(e);}return r===true?{ok:true}:{ok:false,why:typeof r==='string'?r:''};});
  if(RES.length&&RES.every(r=>r.ok)){done[CUR.id]=true;LS.set('done',done);}renderPanel();}
function renderPanel(){
  const card=$('#taskCard');const items=CUR.items(P);const n=RES?RES.filter(r=>r.ok).length:0;
  card.replaceChildren(...[h('span',{class:'chip'},CUR.cat),h('h2',null,CUR.t),h('p',{class:'lead',html:CUR.leadF?CUR.leadF(P):CUR.lead}),
    items.length?h('ol',{class:'req'},items.map((it,i)=>h('li',{class:RES?(RES[i].ok?'ok':'no'):''},h('span',{html:it.t}),RES&&!RES[i].ok?h('div',{class:'cmp'},h('span',{class:'k'},'기대 값'),h('span',{html:it.t}),h('span',{class:'k'},'현재 값'),h('span',{class:'v'},(RES[i].why||'요구 조건을 만족하지 않습니다.').replace(/^현재\s*/,''))):null))):null,
    RES&&items.length?h('div',{class:'score'+(n===items.length?' all':'')},n===items.length?h('b',null,`모두 맞았습니다. ${n} / ${items.length}`):[h('b',null,`${n} / ${items.length}`),' 항목 완료. 빨간 항목을 고친 뒤 다시 채점하세요.']):null,
    h('div',{class:'acts'},items.length?h('button',{class:'btn pri',type:'button',onclick:grade},'채점하기'):null,h('button',{class:'btn',type:'button',onclick:()=>{SHOWH=!SHOWH;renderPanel();}},SHOWH?'풀이 숨기기':'풀이 보기'),
      CUR.id!=='free'?h('button',{class:'btn',type:'button',onclick:()=>startTask(CUR.id)},'새 문제'):null,h('button',{class:'btn',type:'button',onclick:()=>startTask(CUR.id,true)},'처음부터')),
    SHOWH?h('div',{class:'hint'},h('b',null,'풀이 예시'),h('ol',null,CUR.hint(P).map(s=>h('li',{class:/^[a-z:/#]/i.test(s)?'cmd':null},s)))):null].filter(Boolean));
  const tl=$('#taskList');tl.replaceChildren();let cat='';
  TASKS.forEach(t=>{if(t.cat!==cat){cat=t.cat;tl.append(h('div',{class:'cat'},cat));}tl.append(h('button',{type:'button',class:(t===CUR?'cur ':'')+(done[t.id]?'done':''),onclick:()=>{startTask(t.id);if(innerWidth<1100)$('#term').scrollIntoView({behavior:'smooth',block:'start'});cmdEl.focus({preventScroll:true});}},h('span',{class:'st'}),t.t));});
  const real=TASKS.filter(t=>t.id!=='free');$('#prog').textContent=`완료 ${real.filter(t=>done[t.id]).length} / ${real.length}`;
}
$('#refTable').append(...[['/etc/passwd','사용자 계정 (이름:x:UID:GID:설명:홈:셸)'],['/etc/shadow','암호와 사용 기간'],['/etc/group','그룹 (이름:x:GID:구성원)'],['/etc/sysconfig/network-scripts/ifcfg-ens33','네트워크 인터페이스 (영구)'],['/etc/resolv.conf','DNS 서버 (nameserver)'],['/etc/hosts','이름 ↔ IP 직접 지정'],['/etc/hostname','호스트 이름'],['/etc/fstab','부팅 시 마운트 (장치 마운트포인트 형식 옵션 덤프 검사)'],['/etc/ssh/sshd_config','SSH 서버 (Port, PermitRootLogin)'],['/etc/httpd/conf/httpd.conf','웹 서버 (Listen, DocumentRoot)'],['/var/spool/cron/사용자','사용자 crontab'],['/etc/login.defs','암호 기본 정책 (PASS_MAX_DAYS 등)'],['/var/log/messages · secure','시스템 로그 · 인증 로그']].map(([a,b])=>h('tr',null,h('td',null,h('code',null,a)),h('td',null,b))));
startTask(LS.get('cur','files'));
